name: Release

on:
  push:
    branches:
      - master
  # Manual re-publish path: publishes the version currently on master (e.g.
  # after a publish-step failure) without cutting a new release.
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================================
  # Release Please — opens / updates the release PR, tags + creates a Release
  # when the PR is merged.
  # ============================================================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Output names, read from the pinned action's own source (v4,
    # src/index.ts `setPathOutput`): every per-release key is emitted as
    # `<path>--<key>`, EXCEPT for the root path ".", which is special-cased to
    # the bare name. So the SDK keeps the unprefixed `release_created` it always
    # had, and the CLI is `packages/cli--release_created`. There is no
    # `.--release_created`.
    #
    # These keys are set only INSIDE the loop over created releases, so when
    # nothing is released they are unset (empty) rather than the string "false"
    # — which is what makes a bare `if:` on them safe. `releases_created`
    # (plural) is always set, to "false" when empty, and a bare `if:` on THAT
    # would be truthy every run. Do not gate on it.
    outputs:
      sdk_released: ${{ steps.release.outputs.release_created }}
      cli_released: ${{ steps.release.outputs['packages/cli--release_created'] }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Publish to npm — runs only when release-please created a tag + Release
  # in the previous job. Re-runs the test + build gate as defense-in-depth, then
  # publishes via npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN.
  # The trusted publisher must be configured on the package settings page:
  # https://www.npmjs.com/package/@transcodely/sdk/access
  # ============================================================================
  publish-npm:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.sdk_released || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for npm trusted publishing + --provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Trusted publishing (OIDC) requires npm >= 11.5.1; the runner ships an
      # older npm by default. Pinned to npm 11 — npm 12 dropped Node 20 support
      # and `npm@latest` broke the 0.2.0 publish. `access` and `provenance`
      # come from the token exchange + publishConfig, so no `--access` or
      # `NODE_AUTH_TOKEN` needed.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm
        run: npm publish --provenance

      - name: Release Summary
        run: |
          echo "## npm release published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ needs.release-please.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ needs.release-please.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Install:** \`npm install @transcodely/sdk@${{ needs.release-please.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **npm:** https://www.npmjs.com/package/@transcodely/sdk/v/${{ needs.release-please.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Publish the CLI (`transcodely`) — a separate package with its own release
  # PR and its own tag (cli-vX.Y.Z). Without this job a merged CLI release PR
  # would tag and cut a GitHub Release with no publish at all, which reads like
  # a successful release. While the package is still `private` the job says so
  # and stops, rather than failing a release that was never meant to ship it.
  # ============================================================================
  publish-cli:
    name: Publish CLI to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_released }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build
        run: pnpm typecheck && pnpm test && pnpm build

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      # `npm publish` does NOT rewrite the `workspace:` protocol, so a tarball
      # built while the dependency still reads `workspace:^` would install
      # nothing. Refuse loudly rather than publish something broken.
      - name: Publish
        working-directory: packages/cli
        run: |
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "## CLI publish skipped" >> $GITHUB_STEP_SUMMARY
            echo "\`packages/cli\` is still \`private\`. Drop it and pin @transcodely/sdk to a published version to ship the CLI (see packages/cli/README.md)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if node -p "JSON.stringify(require('./package.json').dependencies)" | grep -q 'workspace:'; then
            echo "packages/cli still depends on @transcodely/sdk via the workspace protocol; pin a published version first." >&2
            exit 1
          fi
          npm publish --provenance
