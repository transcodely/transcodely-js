// Billing service — organization invoices and the running period statement.
syntax = "proto3";

package transcodely.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "transcodely/v1/common.proto";

// BillingService reads an organization's billing statements.
//
// An invoice is the statement for one billing period: every job that reached a
// billable terminal state in that window, itemized. Invoices are generated
// automatically at the end of each period — there is no API to create, edit, or
// delete one, because a statement is a record of what happened rather than a
// document that is authored.
//
// WHAT IS BILLED. A job is billed once, when it reaches a terminal state, for
// what it actually produced:
//
//   - completed  — the whole job, including the per-job minimum charge if the
//                  computed cost fell below it.
//   - partial /
//     canceled   — only the outputs that completed and were delivered. Work
//                  that never finished is not billed, and the minimum charge
//                  does NOT apply.
//   - failed     — nothing. A failed job never appears on an invoice.
//
// Cost depends on codec, resolution, framerate and quality tier (plus any
// metered add-ons). Job priority does NOT affect price.
//
// AUTHORIZATION. These RPCs are organization-scoped and available to
// organization OWNERS through the dashboard only. Calls authenticated with an
// API key are rejected: an API key is scoped to a single app, while billing is
// settled for the whole organization. Requests must carry the target
// organization in the X-Organization-ID header.
service BillingService {
  // List the organization's invoices, newest period first.
  //
  // Only finalized statements are returned — an invoice still being generated
  // for a just-ended period is never visible. Use GetUpcomingInvoice for the
  // period that is currently accruing.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);

  // Retrieve one invoice, including its line items.
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);

  // Retrieve the statement for the period currently accruing.
  //
  // Computed live from settled jobs rather than stored, so it changes as jobs
  // finish and it has no id: it is an estimate of the next invoice, not an
  // invoice. It becomes one — with an id, and unchanged totals — shortly after
  // the period ends. Jobs still running are not included at any price; a job
  // is billed only once it settles.
  rpc GetUpcomingInvoice(GetUpcomingInvoiceRequest) returns (GetUpcomingInvoiceResponse);

  // Retrieve the organization's billing profile: whether a payment method is
  // on file, and the card details the payment provider exposes for display.
  //
  // Read-only and side-effect free: it never creates provider resources. An
  // organization that has never touched billing gets payment_method_state
  // "none" and an empty payment_methods list.
  rpc GetBillingProfile(GetBillingProfileRequest) returns (GetBillingProfileResponse);

  // Create a short-lived session for the payment provider's hosted billing
  // portal and return its URL. The portal is where a payment method is added
  // or replaced and where receipts live; card details never touch the
  // Transcodely API.
  //
  // First call for an organization also links it to the payment provider
  // (customer + subscription), so the returned portal is already attached to
  // this organization's billing account. Safe to call repeatedly.
  rpc CreateBillingPortalSession(CreateBillingPortalSessionRequest) returns (CreateBillingPortalSessionResponse);

  // Retrieve the organization's monthly budget together with the spend it is
  // measured against, in one call: everything a budget card needs.
  rpc GetBudget(GetBudgetRequest) returns (GetBudgetResponse);

  // Set or clear the organization's monthly budget.
  //
  // Omitting amount_eur clears the budget and turns the alert emails off.
  // Changing the amount never re-sends an alert step already sent this period;
  // see Budget.notified_steps.
  rpc UpdateBudget(UpdateBudgetRequest) returns (UpdateBudgetResponse);

  // Retrieve the organization's outstanding balance — usage that has been
  // accrued but not yet billed — together with the threshold it is measured
  // against, in one call: everything an outstanding-balance card needs.
  //
  // Distinct from GetUpcomingInvoice, which shows what the CURRENT PERIOD has
  // accrued. This shows what is UNSETTLED, which also includes anything a
  // previous period left uncaptured, and it is the number that decides whether
  // new jobs are admitted.
  rpc GetOutstandingBalance(GetOutstandingBalanceRequest) returns (GetOutstandingBalanceResponse);

  // Pay the outstanding balance now, without waiting for the period to end.
  //
  // Closes the current period at this instant and produces a real statement for
  // everything owed, which the payment provider then charges. On success the
  // outstanding balance is zero, any admission block is lifted immediately, and
  // the organization's trust tier re-evaluates once the statement is paid.
  //
  // Returns failed_precondition with error code "settlement_unavailable" when
  // the deployment has mid-cycle settlement switched off, and
  // "nothing_outstanding" when there is nothing to pay.
  rpc SettleOutstandingBalance(SettleOutstandingBalanceRequest) returns (SettleOutstandingBalanceResponse);
}

// =============================================================================
// Resource messages
// =============================================================================

// A billing statement for one period.
//
// All monetary amounts are integer minor units (cents) of the invoice's
// currency — 1250 in EUR is €12.50. Following the protobuf JSON mapping for
// 64-bit integers, they are rendered as JSON strings ("1250"), not numbers.
message Invoice {
  // Unique identifier (e.g., "inv_a1b2c3d4e5f6").
  // Empty on the upcoming invoice, which is computed and not yet stored.
  string id = 1;

  // Object type, always "invoice".
  string object = 2;

  // Organization this statement bills.
  string org_id = 3;

  // Lifecycle state. The upcoming invoice reports "draft".
  InvoiceStatus status = 4;

  // Start of the billing period (inclusive).
  google.protobuf.Timestamp period_start = 5;

  // End of the billing period (exclusive). A job that settles at or after this
  // instant belongs to the next period, even if it started before it.
  google.protobuf.Timestamp period_end = 6;

  // ISO 4217 currency code. Always "EUR" today.
  string currency = 7;

  // Sum of the itemized lines, excluding the rounding adjustment, in cents.
  int64 subtotal_cents = 8;

  // Amount charged, in cents. Equals the sum of every line item including the
  // rounding adjustment, and equals the sum of the settled jobs it covers.
  int64 total_cents = 9;

  // The payment provider's invoice number, once the statement has been matched
  // to the provider's own record. Absent until then; its absence never means
  // unpaid.
  optional string provider_invoice_number = 10;

  // When the statement was finalized and became visible. Absent on the
  // upcoming invoice.
  google.protobuf.Timestamp finalized_at = 11;

  // When payment was received. Absent unless status is "paid".
  google.protobuf.Timestamp paid_at = 12;

  // The itemized breakdown, in display order.
  repeated InvoiceLineItem line_items = 13;

  // When the statement row was created.
  google.protobuf.Timestamp created_at = 14;
}

// One line of an invoice's breakdown.
//
// Line items explain the total; they do not compute it. They are regenerated
// wholesale whenever a statement is rebuilt before finalization, so a line item
// id is not stable until the invoice is finalized.
message InvoiceLineItem {
  // Unique identifier (e.g., "li_a1b2c3d4e5f6g7"). Empty on the upcoming
  // invoice, whose lines are computed rather than stored.
  string id = 1;

  // What kind of charge this line represents.
  InvoiceLineType line_type = 2;

  // Human-readable description, e.g. "Encoding — h264 1080p standard".
  string description = 3;

  // How many units the line covers (e.g. 12 outputs). Absent for lines that
  // are not metered, such as the rounding adjustment.
  optional double quantity = 4;

  // Unit that quantity is counted in, e.g. "output" or "minute".
  string unit = 5;

  // Amount for this line, in cents. Signed: the rounding adjustment is
  // routinely negative.
  int64 amount_cents = 6;

  // The grouping key that produced this line, e.g.
  // {"app_id": "app_k1l2m3n4o5", "codec": "h264", "resolution": "1080p"}.
  // Keys vary by line_type and new ones may be added.
  map<string, string> dimensions = 7;
}

// An organization's payment standing: whether the payment provider can charge
// it, and what the customer sees when they look.
//
// Payment METHODS are read live from the payment provider on every request
// rather than mirrored locally, so a card added in the hosted portal shows up
// on the next read with no polling and no waiting for a webhook. STANDING is
// derived at request time from the organization's stored billing facts
// (invoice outcomes, observed payment methods) together with that live read, so
// it is never staler than the page showing it.
message BillingProfile {
  // Object type, always "billing_profile".
  string object = 1;

  // Organization this profile describes.
  string org_id = 2;

  // Whether a payment method is on file. Determined by whether the payment
  // provider holds any payment method for this organization, and by nothing
  // else — in particular, a method missing its card details is still a
  // payment method.
  PaymentMethodState payment_method_state = 3;

  // The methods the provider holds, for display only. Empty when the state is
  // "none", and never empty when the state is "on_file".
  repeated BillingPaymentMethod payment_methods = 4;

  // The organization's billing email, which the payment provider requires
  // before it will accept a payment method. Absent when unset.
  optional string billing_email = 5;

  // The organization's derived payment health, and what its usage limits
  // resolve from. See BillingStanding.
  BillingStanding standing = 6;

  // When the current grace window closes. Present if and only if standing is
  // BILLING_STANDING_GRACE. At this instant the account is already past it —
  // the deadline is inclusive — and what it becomes is determined by
  // standing_reason: a card problem decays to FREE, an unpaid invoice to
  // DELINQUENT.
  optional google.protobuf.Timestamp grace_until = 7;

  // Why standing is what it is, as a stable token to switch on rather than
  // copy to display:
  //
  //   ""                         nothing is wrong
  //   "exempt"                   the org is not required to hold a payment
  //                              method, so standing is always active
  //   "no_payment_method"        none has ever been on file
  //   "card_expired"             one is on file and its expiry has passed
  //   "card_removed"             one we had observed is gone
  //   "invoice_past_due"         an invoice failed to collect
  //   "repeated_invoice_failure" a second consecutive failure, which earns no
  //                              grace window at all
  //
  // New tokens may be added; treat an unrecognized one as a generic billing
  // problem rather than failing.
  string standing_reason = 8;

  // Whether this organization must hold a payment method. FALSE means it is
  // exempt — organizations predating the requirement are, and an operator may
  // exempt one deliberately — in which case standing is always
  // BILLING_STANDING_ACTIVE and no banner or prompt about payment methods
  // should be shown.
  //
  // Exempt is not free service: the organization still accrues usage and is
  // still invoiced. It simply is not limited for lacking a card on file.
  bool payment_method_required = 9;
}

// One payment method held by the payment provider.
//
// Display data only. Card numbers never reach the Transcodely API; a method is
// added, replaced or removed in the provider's hosted portal.
//
// The card detail fields are all optional and are frequently absent even for a
// working card — the payment provider does not always expose card metadata.
// Treat their presence as a bonus: a method with no brand or last4 is a valid,
// chargeable payment method that simply cannot be described more precisely than
// its type. Render it as "Card on file" rather than waiting for digits that may
// never arrive.
message BillingPaymentMethod {
  // The payment provider's identifier for this method.
  string id = 1;

  // Method family: "card", or "generic" for everything else the provider
  // supports (direct debit and similar). Always present.
  string type = 2;

  // Card network, e.g. "visa" or "mastercard". Cards only, and only when the
  // provider exposes it.
  optional string brand = 3;

  // Last four digits of the card number. Cards only, and only when the
  // provider exposes it.
  optional string last4 = 4;

  // Expiry month, 1-12. Cards only, and only when the provider exposes it.
  optional int32 exp_month = 5;

  // Expiry year, four digits. Cards only, and only when the provider exposes
  // it.
  optional int32 exp_year = 6;

  // Whether this is the method the provider charges by default. Advisory: the
  // provider does not always mark a default, so false here does not mean the
  // method is unused, and it is never a signal about the organization's
  // payment standing.
  bool is_default = 7;
}

// A short-lived session for the payment provider's hosted billing portal.
message BillingPortalSession {
  // Object type, always "billing_portal_session".
  string object = 1;

  // Where to send the browser. Single-use and short-lived; request a new
  // session rather than storing this.
  //
  // Points at the portal's settings section, where payment methods are managed,
  // rather than at its landing page.
  string url = 2;

  // When the session stops working. Applies to url and session_token alike —
  // they are two ways into the same session.
  google.protobuf.Timestamp expires_at = 3;

  // Short-lived (~1h), single-customer-scoped token for the provider's embedded
  // payment-method form, so a card can be added in place instead of by
  // redirecting to the hosted portal.
  //
  // Same trust level as `url`, which reaches the same portal as the same
  // customer with no further authentication. It is still a bare credential:
  // hand it to the embed, never log or store it, and request a new session
  // instead of reusing one.
  //
  // Empty when the configured provider exposes no such token; fall back to
  // opening `url`.
  string session_token = 4;
}

// An organization's monthly budget and the spend it is measured against.
//
// A budget is the customer's OWN telemetry: it exists so an account can be told
// it is spending more than it meant to. It NEVER enforces anything. Crossing
// 100% of a budget sends an email and changes nothing else — no job is
// rejected, no video stops playing, no limit is applied.
//
// It is not the per-app spend LIMIT (App.monthly_spend_limit_eur, set via
// AppService.UpdateSpendLimit), which IS a hard cap: at 100% of a spend limit,
// new jobs are refused. Limits block; budgets notify. An organization can use
// either, both, or neither.
message Budget {
  // Object type, always "budget".
  string object = 1;

  // Organization this budget belongs to.
  string org_id = 2;

  // The monthly budget in EUR. Absent when no budget is set, which is the
  // default and means no alerts are sent.
  optional double amount_eur = 3;

  // Spend so far in the current billing period, in EUR.
  //
  // This is the same ledger, over the same window, that GetUpcomingInvoice
  // reports — it covers transcoding AND hosting for every app in the
  // organization, and it excludes usage that will never be billed. It is
  // therefore NOT the same number as AppService.GetSpend, which is scoped to
  // one app, counts estimates for jobs still running, and knows nothing about
  // hosting.
  double spent_eur = 4;

  // spent_eur as a percentage of amount_eur. Absent when no budget is set.
  // Not capped at 100: an organization at 240% of its budget is shown 240.
  optional double used_percent = 5;

  // Start of the current billing period (inclusive), UTC.
  google.protobuf.Timestamp period_start = 6;

  // End of the current billing period (exclusive), UTC. Spend resets here.
  google.protobuf.Timestamp period_end = 7;

  // The percentage steps that send an alert email, ascending. Fixed at
  // 50, 80 and 100 today; new steps may be added.
  repeated int32 alert_steps = 8;

  // The steps already emailed this billing period, ascending. Fire-once per
  // period: a step listed here does not send again, and changing the budget
  // mid-period does not re-arm it. Empty at the start of every period.
  repeated int32 notified_steps = 9;

  // ISO 4217 currency code for every amount here. Always "EUR" today.
  string currency = 10;
}

// An organization's unsettled balance and the threshold it is measured against.
//
// # What the number is
//
// Usage that has been accrued and NOT yet captured onto a statement —
// transcoding and hosting, across every app in the organization. Paying a
// statement, or settling mid-cycle, resets it to zero.
//
// It is a different number from all three of its neighbours, and the
// differences matter:
//
//   - GetUpcomingInvoice shows what THIS PERIOD has accrued. This shows what is
//     UNSETTLED, which also carries anything an earlier period left uncaptured.
//   - Budget.spent_eur keeps counting after an invoice is issued, because spend
//     does not un-happen when it is billed. This drops to zero when it is.
//   - App.monthly_spend_limit_eur is a cap the customer sets on one app for
//     themselves. This is the platform's own exposure control over the whole
//     organization, and no calendar clears it — only payment does.
//
// # What happens as it climbs
//
// Nothing, for a long time. Reminder emails go out at 80%, 100%, 125%, 150% and
// 175% of the threshold and NOTHING is restricted at any of them: service
// continues past the threshold on purpose, so that a busy month never stops a
// pipeline without warning. Only at `hard_stop_cents` — twice the threshold —
// are new jobs refused, with error code "outstanding_balance_exceeded".
//
// Even then, work already queued or running finishes, outputs are delivered,
// videos keep playing, uploads keep working and jobs can still be canceled.
// Paying lifts the block on the very next request.
message OutstandingBalance {
  // Object type, always "outstanding_balance".
  string object = 1;

  // Organization this balance belongs to.
  string org_id = 2;

  // The unsettled amount, in integer minor units (cents) of `currency`.
  // Rendered as a JSON string per the protobuf 64-bit integer mapping.
  int64 outstanding_cents = 3;

  // The trust tier the organization's payment history puts it on, which is what
  // sets the threshold unless an operator or a plan overrides it.
  TrustTier tier = 4;

  // How many statements this organization has PAID. The input behind `tier`,
  // surfaced so the path to a higher threshold is visible rather than implied.
  // A mid-cycle settlement counts once it is paid, like any other statement.
  int64 settled_payments = 5;

  // The threshold, in cents. Absent when no threshold applies at all — a
  // long-standing account with no plan ceiling has none, which is the intended
  // destination of the whole ladder.
  optional int64 threshold_cents = 6;

  // Which rung supplied `threshold_cents`.
  ExposureThresholdSource threshold_source = 7;

  // The amount at which new-job admission stops: twice `threshold_cents`.
  // Absent exactly when `threshold_cents` is.
  optional int64 hard_stop_cents = 8;

  // Whether new jobs are being refused right now. Reads the same numbers the
  // admission gate reads, so a card showing false cannot coexist with a create
  // being rejected for this reason.
  bool blocked = 9;

  // `outstanding_cents` as a percentage of `threshold_cents`. Absent when no
  // threshold applies. Not capped at 100: an organization at 180% is shown 180.
  optional double used_percent = 10;

  // The percentage steps that send a reminder email, ascending. 80, 100, 125,
  // 150, 175 and 200 today; the last one is where admission stops.
  repeated int32 alert_steps = 11;

  // The steps already emailed for the current accrual window, ascending.
  // Fire-once: a step listed here does not send again until the balance is
  // settled or the billing period rolls.
  repeated int32 notified_steps = 12;

  // ISO 4217 currency code for every amount here. Always "EUR" today.
  string currency = 13;

  // Whether SettleOutstandingBalance is available on this deployment. False
  // while the settlement rail is disabled — a billing page should not render a
  // "pay now" action that can only fail.
  bool settlement_available = 14;
}

// A statement produced by paying an outstanding balance mid-cycle.
message Settlement {
  // Object type, always "settlement".
  string object = 1;

  // The statement the balance was captured onto. It is an ordinary invoice —
  // readable through GetInvoice, listed by ListInvoices, and paid through the
  // same provider flow as any other.
  string invoice_id = 2;

  // What it came to, in integer minor units (cents).
  int64 amount_cents = 3;

  // The window the statement covers, UTC. It starts where the previous
  // statement ended (or at the period start) and ends at the settlement
  // instant.
  google.protobuf.Timestamp period_start = 4;
  google.protobuf.Timestamp period_end = 5;

  // ISO 4217 currency code. Always "EUR" today.
  string currency = 6;
}

// =============================================================================
// Enums
// =============================================================================

// Invoice lifecycle.
//
// draft -> open -> paid | void | uncollectible. Only "open" and later states
// are ever returned by ListInvoices; "draft" appears only on the upcoming
// invoice.
enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;

  // Being generated, or the live upcoming statement. Not a bill yet.
  INVOICE_STATUS_DRAFT = 1;

  // Finalized and awaiting payment.
  INVOICE_STATUS_OPEN = 2;

  // Paid in full.
  INVOICE_STATUS_PAID = 3;

  // Canceled without payment; nothing is owed.
  INVOICE_STATUS_VOID = 4;

  // Written off as unpayable after collection attempts failed.
  INVOICE_STATUS_UNCOLLECTIBLE = 5;
}

// What an invoice line represents.
enum InvoiceLineType {
  INVOICE_LINE_TYPE_UNSPECIFIED = 0;

  // Encoding work, grouped by app, codec, resolution and quality tier.
  INVOICE_LINE_TYPE_USAGE = 1;

  // A metered add-on, such as AI captions.
  INVOICE_LINE_TYPE_FEE = 2;

  // The per-job minimum charge, summed over the jobs it applied to.
  INVOICE_LINE_TYPE_MIN_CHARGE = 3;

  // The residue that reconciles the itemized lines with the amount charged.
  // Per-line rounding cannot always add up to the sum of per-job rounding; this
  // line carries the difference so the breakdown always matches the total.
  INVOICE_LINE_TYPE_ADJUSTMENT = 4;

  // Metered hosting: managed storage (GB, averaged over the covered days) and
  // CDN delivery (GB egressed), one line per app and service. dimensions
  // carries {"app_id", "service": "storage"|"egress", "covered_from",
  // "covered_through"} — the coverage window rolls with the meter, so the last
  // day or so of a period appears on the next statement rather than this one.
  INVOICE_LINE_TYPE_HOSTING = 5;
}

// How much unbilled usage an organization's payment history earns it.
//
// Derived from the number of statements it has paid, never stored, and it only
// ever moves upward as payments land. It is not a customer segment, a plan, or
// anything anyone is told about beyond the billing page: its single job is to
// answer "how much work should we run for this account before asking to be
// paid".
enum TrustTier {
  TRUST_TIER_UNSPECIFIED = 0;

  // No settled payments yet. Every account starts here, including the ones that
  // go on to spend thousands.
  TRUST_TIER_NEW = 1;

  // One or two settled payments.
  TRUST_TIER_ESTABLISHED = 2;

  // Three or more settled payments. The tier imposes NO threshold of its own —
  // the account falls through to whatever ceiling its plan sets, which for most
  // accounts is none. This is where the ladder is meant to end up.
  TRUST_TIER_PROVEN = 3;
}

// Which rung supplied an organization's outstanding-balance threshold.
//
// Same purpose as LimitSource on the usage ladder: "€50" reads very differently
// depending on whether changing it means an operator editing this organization,
// editing its plan, or the account simply paying an invoice.
enum ExposureThresholdSource {
  EXPOSURE_THRESHOLD_SOURCE_UNSPECIFIED = 0;

  // An operator set this organization's threshold by hand. Audited, and the
  // only rung that can RAISE a threshold above what the tier would give.
  EXPOSURE_THRESHOLD_SOURCE_OVERRIDE = 1;

  // The trust tier's own number — the everyday answer.
  EXPOSURE_THRESHOLD_SOURCE_TRUST_TIER = 2;

  // The monthly spend ceiling on the organization's plan. It joins by MINIMUM,
  // so a plan can only ever tighten what the tier or an operator allowed:
  // carrying more unbilled usage than an account is permitted to spend in a
  // month would be extending credit past the amount it may run up at all.
  EXPOSURE_THRESHOLD_SOURCE_ORG_PLAN = 3;

  // The platform-wide default ceiling.
  EXPOSURE_THRESHOLD_SOURCE_PLATFORM_DEFAULT = 4;

  // Every rung declined: no threshold applies, no reminders are sent and
  // admission is never refused for this reason.
  EXPOSURE_THRESHOLD_SOURCE_UNBOUNDED = 5;
}

// Whether an organization has a payment method the provider can charge.
enum PaymentMethodState {
  PAYMENT_METHOD_STATE_UNSPECIFIED = 0;

  // No payment method on file. Nothing is blocked by this today.
  PAYMENT_METHOD_STATE_NONE = 1;

  // At least one payment method is on file. Says only that the provider holds
  // something it can charge — not that its card details are known.
  PAYMENT_METHOD_STATE_ON_FILE = 2;
}

// =============================================================================
// Requests / responses
// =============================================================================

// Request to list the organization's invoices.
message ListInvoicesRequest {
  // Pagination parameters.
  PaginationRequest pagination = 1;
}

// Response from listing invoices.
message ListInvoicesResponse {
  // Invoices, newest period first. Line items are omitted here; fetch a single
  // invoice to get them.
  repeated Invoice invoices = 1;

  // Pagination metadata.
  PaginationResponse pagination = 2;
}

// Request to retrieve one invoice.
message GetInvoiceRequest {
  // Invoice ID (e.g., "inv_a1b2c3d4e5f6").
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^inv_[a-zA-Z0-9_-]+$"
  ];
}

// Response from retrieving an invoice.
message GetInvoiceResponse {
  // The requested invoice, with its line items.
  Invoice invoice = 1;
}

// Request to retrieve the statement for the period currently accruing.
message GetUpcomingInvoiceRequest {}

// Response carrying the upcoming statement.
message GetUpcomingInvoiceResponse {
  // The computed statement. Its id is empty and its status is "draft". Totals
  // are zero when nothing has been billed in the period yet.
  Invoice invoice = 1;
}

// Request to retrieve the organization's billing profile. The organization is
// taken from the X-Organization-ID header.
message GetBillingProfileRequest {}

// Response carrying the billing profile.
message GetBillingProfileResponse {
  // The organization's payment standing, read live from the payment provider.
  BillingProfile profile = 1;
}

// Request to create a billing portal session. The organization is taken from
// the X-Organization-ID header, and where the portal returns to is fixed by
// the API rather than supplied by the caller.
message CreateBillingPortalSessionRequest {}

// Response carrying the portal session to redirect to.
message CreateBillingPortalSessionResponse {
  // The session. Redirect the browser to its url.
  BillingPortalSession session = 1;
}

// Request to read the organization's monthly budget. The organization is taken
// from the X-Organization-ID header.
message GetBudgetRequest {}

// Response carrying the budget and the spend it is measured against.
message GetBudgetResponse {
  // The budget. Always present: an organization with no budget set gets one
  // with amount_eur absent and spent_eur still populated, so the current
  // period's spend can be shown before a budget exists.
  Budget budget = 1;
}

// Request to set or clear the organization's monthly budget. The organization
// is taken from the X-Organization-ID header.
message UpdateBudgetRequest {
  // Monthly budget in EUR. When present, sets the budget (must be > 0). When
  // ABSENT, the budget is cleared and no further alerts are sent — that is the
  // only way to turn them off. The upper bound matches the NUMERIC(12,2)
  // storage column.
  optional double amount_eur = 1 [
    (buf.validate.field).double.gt = 0,
    (buf.validate.field).double.lte = 9999999999.99
  ];
}

// Response from setting or clearing a budget.
message UpdateBudgetResponse {
  // The budget as it now stands, with current-period spend recomputed, so a
  // caller that just moved the number can render the new bar without a second
  // request. amount_eur is absent when the budget was cleared.
  Budget budget = 1;
}

// Request to read the organization's outstanding balance. The organization is
// taken from the X-Organization-ID header.
message GetOutstandingBalanceRequest {}

// Response carrying the outstanding balance and its threshold.
message GetOutstandingBalanceResponse {
  // Always present. An organization that owes nothing gets one with
  // outstanding_cents 0 and its threshold still populated, so a card can show
  // the headroom before anything has been spent.
  OutstandingBalance balance = 1;
}

// Request to settle the outstanding balance now. The organization is taken from
// the X-Organization-ID header.
//
// It carries no amount ON PURPOSE. The figure is whatever the ledger says at the
// instant the settlement runs, and letting a caller name its own number would
// let a stale page pay less than is owed and leave the difference looking
// settled.
message SettleOutstandingBalanceRequest {}

// Response from settling an outstanding balance.
message SettleOutstandingBalanceResponse {
  // The statement that was produced.
  Settlement settlement = 1;

  // The balance as it now stands — zero, with the block lifted and the steps
  // re-armed — so a caller that just paid can render the new state without a
  // second request.
  OutstandingBalance balance = 2;
}
