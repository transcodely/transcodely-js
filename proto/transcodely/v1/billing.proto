// Billing service — organization invoices and the running period statement.
syntax = "proto3";

package transcodely.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "transcodely/v1/common.proto";

// BillingService reads an organization's billing statements.
//
// An invoice is the statement for one billing period: every job that reached a
// billable terminal state in that window, itemized. Invoices are generated
// automatically at the end of each period — there is no API to create, edit, or
// delete one, because a statement is a record of what happened rather than a
// document that is authored.
//
// WHAT IS BILLED. A job is billed once, when it reaches a terminal state, for
// what it actually produced:
//
//   - completed  — the whole job, including the per-job minimum charge if the
//                  computed cost fell below it.
//   - partial /
//     canceled   — only the outputs that completed and were delivered. Work
//                  that never finished is not billed, and the minimum charge
//                  does NOT apply.
//   - failed     — nothing. A failed job never appears on an invoice.
//
// Cost depends on codec, resolution, framerate and quality tier (plus any
// metered add-ons). Job priority does NOT affect price.
//
// AUTHORIZATION. These RPCs are organization-scoped and available to
// organization OWNERS through the dashboard only. Calls authenticated with an
// API key are rejected: an API key is scoped to a single app, while billing is
// settled for the whole organization. Requests must carry the target
// organization in the X-Organization-ID header.
service BillingService {
  // List the organization's invoices, newest period first.
  //
  // Only finalized statements are returned — an invoice still being generated
  // for a just-ended period is never visible. Use GetUpcomingInvoice for the
  // period that is currently accruing.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);

  // Retrieve one invoice, including its line items.
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);

  // Retrieve the statement for the period currently accruing.
  //
  // Computed live from settled jobs rather than stored, so it changes as jobs
  // finish and it has no id: it is an estimate of the next invoice, not an
  // invoice. It becomes one — with an id, and unchanged totals — shortly after
  // the period ends. Jobs still running are not included at any price; a job
  // is billed only once it settles.
  rpc GetUpcomingInvoice(GetUpcomingInvoiceRequest) returns (GetUpcomingInvoiceResponse);

  // Retrieve the organization's billing profile: whether a payment method is
  // on file, and the card details the payment provider exposes for display.
  //
  // Read-only and side-effect free: it never creates provider resources. An
  // organization that has never touched billing gets payment_method_state
  // "none" and an empty payment_methods list.
  rpc GetBillingProfile(GetBillingProfileRequest) returns (GetBillingProfileResponse);

  // Create a short-lived session for the payment provider's hosted billing
  // portal and return its URL. The portal is where a payment method is added
  // or replaced and where receipts live; card details never touch the
  // Transcodely API.
  //
  // First call for an organization also links it to the payment provider
  // (customer + subscription), so the returned portal is already attached to
  // this organization's billing account. Safe to call repeatedly.
  rpc CreateBillingPortalSession(CreateBillingPortalSessionRequest) returns (CreateBillingPortalSessionResponse);
}

// =============================================================================
// Resource messages
// =============================================================================

// A billing statement for one period.
//
// All monetary amounts are integer minor units (cents) of the invoice's
// currency — 1250 in EUR is €12.50. Following the protobuf JSON mapping for
// 64-bit integers, they are rendered as JSON strings ("1250"), not numbers.
message Invoice {
  // Unique identifier (e.g., "inv_a1b2c3d4e5f6").
  // Empty on the upcoming invoice, which is computed and not yet stored.
  string id = 1;

  // Object type, always "invoice".
  string object = 2;

  // Organization this statement bills.
  string org_id = 3;

  // Lifecycle state. The upcoming invoice reports "draft".
  InvoiceStatus status = 4;

  // Start of the billing period (inclusive).
  google.protobuf.Timestamp period_start = 5;

  // End of the billing period (exclusive). A job that settles at or after this
  // instant belongs to the next period, even if it started before it.
  google.protobuf.Timestamp period_end = 6;

  // ISO 4217 currency code. Always "EUR" today.
  string currency = 7;

  // Sum of the itemized lines, excluding the rounding adjustment, in cents.
  int64 subtotal_cents = 8;

  // Amount charged, in cents. Equals the sum of every line item including the
  // rounding adjustment, and equals the sum of the settled jobs it covers.
  int64 total_cents = 9;

  // The payment provider's invoice number, once the statement has been matched
  // to the provider's own record. Absent until then; its absence never means
  // unpaid.
  optional string provider_invoice_number = 10;

  // When the statement was finalized and became visible. Absent on the
  // upcoming invoice.
  google.protobuf.Timestamp finalized_at = 11;

  // When payment was received. Absent unless status is "paid".
  google.protobuf.Timestamp paid_at = 12;

  // The itemized breakdown, in display order.
  repeated InvoiceLineItem line_items = 13;

  // When the statement row was created.
  google.protobuf.Timestamp created_at = 14;
}

// One line of an invoice's breakdown.
//
// Line items explain the total; they do not compute it. They are regenerated
// wholesale whenever a statement is rebuilt before finalization, so a line item
// id is not stable until the invoice is finalized.
message InvoiceLineItem {
  // Unique identifier (e.g., "li_a1b2c3d4e5f6g7"). Empty on the upcoming
  // invoice, whose lines are computed rather than stored.
  string id = 1;

  // What kind of charge this line represents.
  InvoiceLineType line_type = 2;

  // Human-readable description, e.g. "Encoding — h264 1080p standard".
  string description = 3;

  // How many units the line covers (e.g. 12 outputs). Absent for lines that
  // are not metered, such as the rounding adjustment.
  optional double quantity = 4;

  // Unit that quantity is counted in, e.g. "output" or "minute".
  string unit = 5;

  // Amount for this line, in cents. Signed: the rounding adjustment is
  // routinely negative.
  int64 amount_cents = 6;

  // The grouping key that produced this line, e.g.
  // {"app_id": "app_k1l2m3n4o5", "codec": "h264", "resolution": "1080p"}.
  // Keys vary by line_type and new ones may be added.
  map<string, string> dimensions = 7;
}

// An organization's payment standing: whether the payment provider can charge
// it, and what the customer sees when they look.
//
// Derived live from the payment provider on every read rather than stored, so
// a card added in the hosted portal shows up on the next request with no
// polling and no waiting for a webhook.
message BillingProfile {
  // Object type, always "billing_profile".
  string object = 1;

  // Organization this profile describes.
  string org_id = 2;

  // Whether a payment method is on file. Determined by whether the payment
  // provider holds any payment method for this organization, and by nothing
  // else — in particular, a method missing its card details is still a
  // payment method.
  PaymentMethodState payment_method_state = 3;

  // The methods the provider holds, for display only. Empty when the state is
  // "none", and never empty when the state is "on_file".
  repeated BillingPaymentMethod payment_methods = 4;

  // The organization's billing email, which the payment provider requires
  // before it will accept a payment method. Absent when unset.
  optional string billing_email = 5;
}

// One payment method held by the payment provider.
//
// Display data only. Card numbers never reach the Transcodely API; a method is
// added, replaced or removed in the provider's hosted portal.
//
// The card detail fields are all optional and are frequently absent even for a
// working card — the payment provider does not always expose card metadata.
// Treat their presence as a bonus: a method with no brand or last4 is a valid,
// chargeable payment method that simply cannot be described more precisely than
// its type. Render it as "Card on file" rather than waiting for digits that may
// never arrive.
message BillingPaymentMethod {
  // The payment provider's identifier for this method.
  string id = 1;

  // Method family: "card", or "generic" for everything else the provider
  // supports (direct debit and similar). Always present.
  string type = 2;

  // Card network, e.g. "visa" or "mastercard". Cards only, and only when the
  // provider exposes it.
  optional string brand = 3;

  // Last four digits of the card number. Cards only, and only when the
  // provider exposes it.
  optional string last4 = 4;

  // Expiry month, 1-12. Cards only, and only when the provider exposes it.
  optional int32 exp_month = 5;

  // Expiry year, four digits. Cards only, and only when the provider exposes
  // it.
  optional int32 exp_year = 6;

  // Whether this is the method the provider charges by default. Advisory: the
  // provider does not always mark a default, so false here does not mean the
  // method is unused, and it is never a signal about the organization's
  // payment standing.
  bool is_default = 7;
}

// A short-lived session for the payment provider's hosted billing portal.
message BillingPortalSession {
  // Object type, always "billing_portal_session".
  string object = 1;

  // Where to send the browser. Single-use and short-lived; request a new
  // session rather than storing this.
  string url = 2;

  // When the session stops working.
  google.protobuf.Timestamp expires_at = 3;
}

// =============================================================================
// Enums
// =============================================================================

// Invoice lifecycle.
//
// draft -> open -> paid | void | uncollectible. Only "open" and later states
// are ever returned by ListInvoices; "draft" appears only on the upcoming
// invoice.
enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;

  // Being generated, or the live upcoming statement. Not a bill yet.
  INVOICE_STATUS_DRAFT = 1;

  // Finalized and awaiting payment.
  INVOICE_STATUS_OPEN = 2;

  // Paid in full.
  INVOICE_STATUS_PAID = 3;

  // Canceled without payment; nothing is owed.
  INVOICE_STATUS_VOID = 4;

  // Written off as unpayable after collection attempts failed.
  INVOICE_STATUS_UNCOLLECTIBLE = 5;
}

// What an invoice line represents.
enum InvoiceLineType {
  INVOICE_LINE_TYPE_UNSPECIFIED = 0;

  // Encoding work, grouped by app, codec, resolution and quality tier.
  INVOICE_LINE_TYPE_USAGE = 1;

  // A metered add-on, such as AI captions.
  INVOICE_LINE_TYPE_FEE = 2;

  // The per-job minimum charge, summed over the jobs it applied to.
  INVOICE_LINE_TYPE_MIN_CHARGE = 3;

  // The residue that reconciles the itemized lines with the amount charged.
  // Per-line rounding cannot always add up to the sum of per-job rounding; this
  // line carries the difference so the breakdown always matches the total.
  INVOICE_LINE_TYPE_ADJUSTMENT = 4;
}

// Whether an organization has a payment method the provider can charge.
enum PaymentMethodState {
  PAYMENT_METHOD_STATE_UNSPECIFIED = 0;

  // No payment method on file. Nothing is blocked by this today.
  PAYMENT_METHOD_STATE_NONE = 1;

  // At least one payment method is on file. Says only that the provider holds
  // something it can charge — not that its card details are known.
  PAYMENT_METHOD_STATE_ON_FILE = 2;
}

// =============================================================================
// Requests / responses
// =============================================================================

// Request to list the organization's invoices.
message ListInvoicesRequest {
  // Pagination parameters.
  PaginationRequest pagination = 1;
}

// Response from listing invoices.
message ListInvoicesResponse {
  // Invoices, newest period first. Line items are omitted here; fetch a single
  // invoice to get them.
  repeated Invoice invoices = 1;

  // Pagination metadata.
  PaginationResponse pagination = 2;
}

// Request to retrieve one invoice.
message GetInvoiceRequest {
  // Invoice ID (e.g., "inv_a1b2c3d4e5f6").
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^inv_[a-zA-Z0-9_-]+$"
  ];
}

// Response from retrieving an invoice.
message GetInvoiceResponse {
  // The requested invoice, with its line items.
  Invoice invoice = 1;
}

// Request to retrieve the statement for the period currently accruing.
message GetUpcomingInvoiceRequest {}

// Response carrying the upcoming statement.
message GetUpcomingInvoiceResponse {
  // The computed statement. Its id is empty and its status is "draft". Totals
  // are zero when nothing has been billed in the period yet.
  Invoice invoice = 1;
}

// Request to retrieve the organization's billing profile. The organization is
// taken from the X-Organization-ID header.
message GetBillingProfileRequest {}

// Response carrying the billing profile.
message GetBillingProfileResponse {
  // The organization's payment standing, read live from the payment provider.
  BillingProfile profile = 1;
}

// Request to create a billing portal session. The organization is taken from
// the X-Organization-ID header, and where the portal returns to is fixed by
// the API rather than supplied by the caller.
message CreateBillingPortalSessionRequest {}

// Response carrying the portal session to redirect to.
message CreateBillingPortalSessionResponse {
  // The session. Redirect the browser to its url.
  BillingPortalSession session = 1;
}
