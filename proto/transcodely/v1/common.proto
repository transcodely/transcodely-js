// Common types shared across services.
syntax = "proto3";

package transcodely.v1;

import "buf/validate/validate.proto";

// Pagination request parameters.
message PaginationRequest {
  // Maximum number of items to return (default: 20, max: 100).
  int32 limit = 1 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];

  // Pagination cursor from previous response.
  string cursor = 2;

  // Offset for pagination (alternative to cursor).
  int32 offset = 3 [
    (buf.validate.field).int32.gte = 0
  ];
}

// Pagination response metadata.
message PaginationResponse {
  // Cursor for fetching the next page. Empty if no more pages.
  string next_cursor = 1;

  // Total number of items (if available).
  optional int64 total_count = 2 [
    (buf.validate.field).int64.gte = 0
  ];
}

// Standard error details.
message ErrorDetails {
  // Machine-readable error code.
  string code = 1;

  // Human-readable error message.
  string message = 2;

  // Field-specific validation errors.
  repeated FieldViolation field_violations = 3;
}

// Field-level validation error.
message FieldViolation {
  // Path to the field (e.g., "input_url" or "outputs[0].codec").
  string field = 1;

  // Description of the violation.
  string description = 2;
}

// =============================================================================
// Shared Enums (used by both PresetService and JobService)
// =============================================================================

// Video codec options.
enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_H264 = 1;
  VIDEO_CODEC_H265 = 2;
  VIDEO_CODEC_VP9 = 3;
  VIDEO_CODEC_AV1 = 4;
}

// Audio codec options.
enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  AUDIO_CODEC_AAC = 1;
  AUDIO_CODEC_OPUS = 2;
  AUDIO_CODEC_MP3 = 3;
}

// Container format options.
enum Container {
  CONTAINER_UNSPECIFIED = 0;
  CONTAINER_MP4 = 1;
  CONTAINER_WEBM = 2;
  CONTAINER_MKV = 3;
  CONTAINER_TS = 4;
  CONTAINER_MOV = 5;
}

// Video resolution options.
// These represent standard resolution tiers for pricing.
// Custom dimensions are mapped to the nearest tier for pricing purposes.
enum Resolution {
  RESOLUTION_UNSPECIFIED = 0;
  RESOLUTION_480P = 1;   // SD: up to 480p (~307k pixels)
  RESOLUTION_720P = 2;   // HD: up to 720p (~922k pixels)
  RESOLUTION_1080P = 3;  // Full HD: up to 1080p (~2.07M pixels)
  RESOLUTION_1440P = 4;  // QHD: up to 1440p (~3.69M pixels)
  RESOLUTION_2160P = 5;  // 4K UHD: up to 2160p (~8.29M pixels)
  RESOLUTION_4320P = 6;  // 8K UHD: above 2160p
}

// Quality tier affecting encoding speed and quality.
enum QualityTier {
  QUALITY_TIER_UNSPECIFIED = 0;

  // Fast encoding, good quality. Uses ultrafast/veryfast preset.
  // 0.75x price multiplier.
  QUALITY_TIER_ECONOMY = 1;

  // Balanced speed and quality. Uses medium preset.
  // 1.0x price multiplier (baseline).
  QUALITY_TIER_STANDARD = 2;

  // Best quality, slower encoding. Uses slow/veryslow preset.
  // 2.0x price multiplier.
  QUALITY_TIER_PREMIUM = 3;
}

// Output type (container format or streaming type).
// Note: "format" is renamed to "type" in v1 API, but the enum keeps the same name
// for backward compatibility in proto.
enum OutputFormat {
  OUTPUT_FORMAT_UNSPECIFIED = 0;
  OUTPUT_FORMAT_MP4 = 1;
  OUTPUT_FORMAT_WEBM = 2;
  OUTPUT_FORMAT_MKV = 3;
  OUTPUT_FORMAT_MOV = 4;
  OUTPUT_FORMAT_HLS = 5;
  OUTPUT_FORMAT_DASH = 6;
  // Combined HLS + DASH from shared CMAF segments.
  // Produces both master.m3u8 and manifest.mpd from the same fMP4 segments.
  OUTPUT_FORMAT_ADAPTIVE = 7;
}

// Content type for optimizing encoder settings.
enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  CONTENT_TYPE_FILM = 1;        // Natural motion, fine detail (movies, TV shows)
  CONTENT_TYPE_ANIMATION = 2;   // Flat colors, sharp edges (anime, cartoons)
  CONTENT_TYPE_GRAIN = 3;       // Preserve film grain texture (noir, vintage)
  CONTENT_TYPE_GAMING = 4;      // Fast motion, screen content (game recordings)
  CONTENT_TYPE_SPORTS = 5;      // High motion, high framerate (live sports)
  CONTENT_TYPE_STILLIMAGE = 6;  // Mostly static frames (slideshows)
}

// Delivery format for output packaging.
enum DeliveryFormat {
  DELIVERY_FORMAT_UNSPECIFIED = 0;
  DELIVERY_FORMAT_PROGRESSIVE = 1;  // Direct download, simple playback
  DELIVERY_FORMAT_HLS = 2;          // Adaptive streaming (Apple devices, web)
  DELIVERY_FORMAT_DASH = 3;         // Adaptive streaming (Android, web)
  DELIVERY_FORMAT_CMAF = 4;         // Unified HLS+DASH (modern approach)
}

// Video bitrate control mode.
enum BitrateMode {
  BITRATE_MODE_UNSPECIFIED = 0;
  BITRATE_MODE_CRF = 1;  // Constant Rate Factor (quality-based)
  BITRATE_MODE_CBR = 2;  // Constant Bitrate
  BITRATE_MODE_VBR = 3;  // Variable Bitrate
}

// An organization's derived payment health, and the input that can replace its
// assigned usage limits with the free tier's.
//
// DERIVED, never assigned. It is a pure function of stored billing facts — is a
// payment method on file, has it expired, is an invoice past due, how many
// times consecutively — recomputed whenever one of those facts changes. There
// is no API to set it, because setting it would be a claim about a customer's
// payment health that the payment provider had not made.
//
// Lives here rather than in billing.proto because three surfaces carry it: the
// customer's billing profile, the admin app-limits read, and the admin
// organization record.
enum BillingStanding {
  BILLING_STANDING_UNSPECIFIED = 0;

  // No payment method on file, and this organization is required to have one.
  // Usage limits resolve to the free tier's — short outputs, economy quality,
  // one job at a time — whatever plan the account is assigned. Free-tier usage
  // is recorded but never invoiced.
  //
  // Not a penalty. An organization exempt from the payment-method requirement
  // (every organization that predates it) never reports this.
  BILLING_STANDING_FREE = 1;

  // Nothing is wrong: the account's assigned limits apply exactly as they
  // would if billing standing did not exist. Also what an exempt organization
  // always reports.
  BILLING_STANDING_ACTIVE = 2;

  // Something IS wrong — an unpaid invoice, a removed card, an expired one —
  // and the account keeps its full limits anyway until grace_until. The window
  // exists so a card that quietly expired produces a warning rather than a
  // stopped pipeline. What it decays into depends on the cause: a card problem
  // becomes FREE, an unpaid invoice becomes DELINQUENT.
  BILLING_STANDING_GRACE = 3;

  // An invoice is past due and grace is spent or was never granted (a second
  // consecutive failed invoice gets none). Limits drop to the free tier's, but
  // usage continues to BILL: arrears are a limit, not a discount, and an
  // account that settles returns to ACTIVE with its ledger intact.
  //
  // Never a suspension. Running jobs finish, delivery keeps serving, and
  // everything already stored stays readable.
  BILLING_STANDING_DELINQUENT = 4;
}

// How AUTOMATION is allowed to treat an organization.
//
// Orthogonal to BillingStanding, and the distinction is the whole point.
// Standing is a derived FACT about payment health. Treatment is a commercial
// DECISION about whether a cron may act on that fact — email the customer,
// block their creates, suspend them. An account can be in dunning and
// untouchable at the same time.
//
// ASSIGNED, never derived: an operator says what a relationship is, through the
// audited admin RPC. Admin surfaces only; a customer does not learn from an API
// field how patiently we treat them.
enum BillingTreatment {
  BILLING_TREATMENT_UNSPECIFIED = 0;

  // The default and the full lifecycle: the dunning ladder, the soft limit,
  // suspension, every customer email, and the dispute posture.
  BILLING_TREATMENT_NORMAL = 1;

  // Billed COMPLETELY NORMALLY — payment method on file, monthly statements,
  // real charges — and exempt from every automated interruption. A failed
  // payment or a dispute on one of these routes to the founder instead of to
  // the customer, so it becomes a conversation rather than a cutoff.
  //
  // Requires a payment method on file: this is a promise not to interrupt
  // someone who pays, not a way to run an account with no card.
  BILLING_TREATMENT_TRUSTED = 2;

  // Grandfather / comp semantics: not billed, not enforced. Internal, dogfood
  // and legacy accounts. Selecting it also maintains payment_method_required
  // and billing_exempt, in the same transaction, so the standing derivation and
  // this value can never describe different postures.
  BILLING_TREATMENT_EXEMPT = 3;
}

// How far the CONSEQUENCES of an unpaid statement have progressed.
//
// Deliberately NOT a fifth BillingStanding. Standing is payment HEALTH, derived
// from facts. This is what we have DONE about it, and it needs states standing
// cannot express: "new jobs refused but playback still serving" and "suspended"
// are consequences, not healths, and an account can be delinquent for weeks at
// any of them.
//
// Every rung's timing derives from the episode's own start, and the schedule is
// a set of Go constants (domain.DunningStage) rather than configuration — the
// day counts below are documentation of that policy, not a second copy of it.
//
// ADMIN SURFACES ONLY in this release. A customer is told what is happening to
// their account in the email that accompanies each rung; they do not read the
// ladder's internal vocabulary out of an API.
enum DunningStage {
  DUNNING_STAGE_UNSPECIFIED = 0;

  // The resting state: no episode, or one that a payment closed.
  DUNNING_STAGE_NONE = 1;

  // Day 0 — the provider's charge failed and it is retrying on its own
  // schedule. Full service continues; the customer is told, and nothing else
  // happens.
  DUNNING_STAGE_PAST_DUE = 2;

  // Day 3 — still unpaid, and the mail now names the date service will be
  // limited. Full service continues.
  DUNNING_STAGE_WARNED = 3;

  // Day 7 — NEW jobs are refused. Everything already queued or running
  // finishes, playback keeps serving, and the dashboard stays fully readable.
  DUNNING_STAGE_SOFT_LIMITED = 4;

  // Day 14 — the organization is suspended: API keys refused, public playback
  // stopped. Dashboard reads stay open and Cancel stays allowed, so a suspended
  // customer can still see what they owe, pay it, and stop their own meter.
  DUNNING_STAGE_SUSPENDED = 5;

  // Day 45 — the T-14 notice naming the exact date stored media goes. Nothing
  // new is enforced here; the mail IS the event.
  DUNNING_STAGE_DELETION_WARNED = 6;

  // Day 60 — statements marked uncollectible, ledger entries flagged, stored
  // media eligible for deletion. The organization stays suspended. Terminal for
  // this episode.
  //
  // Also the state an operator's manual write-off produces: the same end state,
  // reached earlier and by a human. Which of the two happened is answered by
  // the audit log, not by this field.
  DUNNING_STAGE_WRITTEN_OFF = 7;
}
