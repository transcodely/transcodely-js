  Video video = 1;
}

// Request to abort a multipart upload.
message AbortMultipartUploadRequest {
  // Video ID returned from CreateMultipartUpload.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // S3 multipart upload ID from CreateMultipartUpload.
  string upload_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 256}
  ];
}

// Response from aborting a multipart upload.
message AbortMultipartUploadResponse {}

// =============================================================================
// CRUD RPCs
// =============================================================================

// Request to get a video by ID.
message GetVideoRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];
}

// Response from getting a video.
message GetVideoResponse {
  // The requested video.
  Video video = 1;
}

// Request to list videos.
message ListVideosRequest {
  // Maximum number of videos to return (1-100).
  int32 page_size = 1 [
    (buf.validate.field).int32 = {gte: 1, lte: 100}
  ];

  // Pagination token from a previous ListVideosResponse.
  optional string page_token = 2;

  // Optional filter by status (e.g., "ready", "processing").
  optional string status = 3;

  // Optional app filter. API-key callers may omit it (their key's app is used)
  // or pass their own app; a different app is rejected with PermissionDenied.
  // Portal/JWT callers pass it to list a specific app in their org; omitted
  // returns videos across all apps in the org.
  optional string app_id = 4 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];
}

// Response from listing videos.
message ListVideosResponse {
  // List of videos.
  repeated Video videos = 1;

  // Token for fetching the next page. Absent if no more pages.
  optional string next_page_token = 2;

  // Total number of matching videos.
  int32 total_count = 3;
}

// Request to update a video's mutable fields.
message UpdateVideoRequest {
  // clear_tags and a non-empty tags list are mutually exclusive: clearing and
  // replacing tags in the same request is contradictory.
  option (buf.validate.message).cel = {
    id: "update_video.clear_tags_excludes_tags"
    message: "clear_tags cannot be combined with a non-empty tags list"
    expression: "!has(this.clear_tags) || !this.clear_tags || size(this.tags) == 0"
  };

  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // Updated title.
  optional string title = 2;

  // Updated description.
  optional string description = 3;

  // Updated tags (replaces existing tags). Because proto3 repeated fields carry
  // no presence, an empty list is indistinguishable from "unset" on the wire
  // and leaves existing tags unchanged. To remove all tags, set clear_tags.
  repeated string tags = 4;

  // Updated visibility.
  optional string visibility = 5;

  // Set to true to remove all tags. Mutually exclusive with tags.
  optional bool clear_tags = 6;

  // Retain (true) or release (false) this video's source file. Pinning keeps
  // the source past the app's retention window and immediately clears any
  // pending deletion schedule; a retained source is billed as hosted storage
  // ("Retained source videos" on the invoice). Unpinning does not delete
  // anything on the spot: the next sweep schedules the deletion with a fresh
  // warning webhook, no sooner than 72 hours out.
  optional bool source_pinned = 7;

  // Set this video's guide page (Video.guide_url): "on" or "off" pins it,
  // "default" clears the pin so the video follows the app's
  // HostingConfig.guide_pages_enabled again. Unset leaves the video as it is.
  // The page serves only public and unlisted videos regardless.
  optional GuidePageSetting guide_page = 9 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];

  // Field 8 was a boolean guide_page_enabled during development; it never
  // shipped, but stays reserved so no client built against it is misread.
  reserved 8;
  reserved "guide_page_enabled";
}

// A video's guide page setting (Video.guide_page, UpdateVideoRequest.guide_page).
enum GuidePageSetting {
  // Not set. Never returned on a Video (API or webhook); rejected on
  // UpdateVideoRequest.
  GUIDE_PAGE_SETTING_UNSPECIFIED = 0;
  // Follow the app's HostingConfig.guide_pages_enabled default.
  GUIDE_PAGE_SETTING_DEFAULT = 1;
  // Guide page on for this video, whatever the app default says.
  GUIDE_PAGE_SETTING_ON = 2;
  // Guide page off for this video, whatever the app default says.
  GUIDE_PAGE_SETTING_OFF = 3;
}

// Response from updating a video.
message UpdateVideoResponse {
  // The updated video.
  Video video = 1;
}

// Request to delete a video.
message DeleteVideoRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];
}

// Response from deleting a video.
message DeleteVideoResponse {}

// =============================================================================
// Watch RPC
// =============================================================================

// Request to watch a video for real-time status updates.
message WatchVideoRequest {
  // Video ID to watch.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];
}

// Streamed response with video state and event type.
message WatchVideoResponse {
  // Current video state.
  Video video = 1;

  // Type of event that triggered this update. One of: "snapshot" (initial
  // state on subscribe), "status_change", "progress", "completed".
  string event_type = 2;
}

// =============================================================================
// Usage RPC
// =============================================================================

// Request to get usage summary for a billing period.
message GetUsageRequest {
  // Billing month in YYYY-MM format (e.g., "2026-04").
  // Defaults to the current month if not specified.
  optional string billing_month = 1;
}

// Response with usage summary.
message GetUsageResponse {
  // Usage breakdown for the requested period.
  UsageSummary usage = 1;
}

// Aggregated usage and cost summary for a billing period.
message UsageSummary {
  // Billing month in YYYY-MM format.
  string billing_month = 1;

  // Encoding metrics.
  int32 videos_encoded = 2;
  double encoding_minutes = 3;
  double encoding_cost = 4;

  // Storage metrics: the deliverables (renditions, manifests, posters), the
  // invoice line "Hosting — storage". Original source files are not included;
  // retained ones are reported in retained_source_gb_avg / retained_source_cost.
  double storage_gb_avg = 10;
  // Storage cost of the period so far, as your invoice will carry it. Each
  // day is one GB-day: the day's stored bytes at the day's monthly price
  // divided by the days in that month. Days already billed are reported at
  // the rate they were billed at, so a later price or rate-card change never
  // re-prices them; the remaining days (see hosting_estimated_from) are
  // estimated the same way at your current rate.
  double storage_cost = 11;
  int32 videos_hosted = 12;

  // Average daily GB of RETAINED original source files (videos with
  // source_pinned) over the period. Sources inside their retention window are
  // free and not counted.
  double retained_source_gb_avg = 13;
  // Cost of retained original source files so far, the invoice line "Retained
  // source videos": billed like storage_cost, at the same storage rate.
  double retained_source_cost = 14;

  // Egress metrics.
  double egress_gb = 20;
  // Delivery cost of the period so far, as your invoice will carry it:
  // billed delivery at the rate it was billed at, delivery not billed yet
  // estimated at your current rate.
  double egress_cost = 21;
  int64 total_requests = 22;

  // Total cost across all categories (encoding, storage, retained sources,
  // egress).
  double total_cost = 30;

  // ISO 4217 currency code for all monetary fields in this summary (e.g. "EUR").
  string currency = 31;

  // First day (YYYY-MM-DD, UTC) whose storage or delivery cost is an
  // estimate rather than billed usage. Hosting is billed daily, through the
  // previous day, so while you store or deliver video the current period has
  // an estimated tail, and the estimate turns into the billed amount as each
  // day is billed. Empty when no day with hosting usage in the period is
  // still unbilled, which is when storage_cost and egress_cost match your
  // invoice (to within the sub-cent remainder carried to the next charge).
  string hosting_estimated_from = 32;

  // Per-day usage breakdown for the billing period identified by
  // billing_month, oldest day first. With a billing anchor day other than 1,
  // the period spans into the following calendar month, so dates are not
  // limited to the named month. Only days with recorded activity are present
  // (no zero-fill): a day is omitted when it had no storage snapshot, no
  // egress, and no video encoded. Powers the dashboard's usage-trend charts.
  // Populated for both app-scoped and org-scoped (aggregated across the
  // org's apps) calls.
  repeated DailyUsage daily = 40;
}

// One calendar day's slice of usage within a billing period (see
// UsageSummary.daily for period semantics). All monetary fields are in the
// parent UsageSummary's `currency`.
message DailyUsage {
  // Calendar day in YYYY-MM-DD format (UTC).
  string date = 1;

  // Total stored bytes as of this day's snapshot. Point-in-time (the day's
  // recorded storage level), not an increment over the prior day. Zero when
  // no snapshot was taken that day.
  int64 storage_bytes = 2;

  // Bytes egressed during this day (sum of the day's hourly egress records).
  int64 egress_bytes = 3;

  // CDN requests served during this day (sum of the day's hourly records).
  int64 request_count = 4;

  // Encoding cost for videos created on this day, derived from the linked
  // transcoding jobs' actual cost. Zero when no billable video was created.
  double encoding_cost = 5;
}

// =============================================================================
// Playback analytics RPCs
// =============================================================================

// Request for a single video's playback stats.
message GetStatsRequest {
  // Video ID to fetch stats for.
  string video_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // Optional inclusive start of the UTC date range, YYYY-MM-DD (e.g.
  // "2026-07-01"). Omitted means unbounded (all retained history).
  optional string start_date = 2;

  // Optional inclusive end of the UTC date range, YYYY-MM-DD. Omitted means
  // unbounded (up to today).
  optional string end_date = 3;
}

// Response with a video's daily playback stats and range totals.
message GetStatsResponse {
  // Per-day rows within the requested range, oldest day first. Only days with
  // recorded activity are present (no zero-fill).
  repeated VideoStatsDay daily = 1;

  // Totals across the returned days.
  VideoStatsTotals totals = 2;
}

// One UTC day of playback stats for a video.
message VideoStatsDay {
  // Calendar day in YYYY-MM-DD format (UTC).
  string date = 1;

  // Number of playback starts (one 'play' beacon per pageview that began
  // playing).
  int32 plays = 2;

  // Approximate watch time in seconds. Derived from playback heartbeats
  // (heartbeat count × the ~10s heartbeat interval), not exact wall-clock
  // time — a partial final interval still counts as a whole one.
  int64 watch_seconds = 3;

  // Distinct viewers, counted by an anonymous per-pageview session id (no PII).
  int32 unique_viewers = 4;
}

// Aggregated playback totals over a date range.
message VideoStatsTotals {
  // Sum of daily plays.
  int32 plays = 1;

  // Sum of daily approximate watch seconds.
  int64 watch_seconds = 2;

  // Sum of per-day unique viewers. A viewer active on N distinct days counts N
  // times (it is not de-duplicated across days); for a single-day range it is
  // exact.
  int32 unique_viewers = 3;
}

// Request for an app's top videos by plays.
message ListTopVideosRequest {
  // Optional app filter. API-key callers may omit it (their key's app is used)
  // or pass their own app; a different app is rejected with PermissionDenied.
  // Portal/JWT callers pass the app to scope the leaderboard; omitted resolves
  // to the org's first app.
  optional string app_id = 1 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];

  // Optional inclusive UTC date range bounds, YYYY-MM-DD. Omitted means
  // unbounded on that side.
  optional string start_date = 2;
  optional string end_date = 3;

  // Maximum number of videos to return (1-100). Defaults to 10.
  optional int32 limit = 4 [
    (buf.validate.field).int32 = {gte: 1, lte: 100}
  ];
}

// Response with an app's ranked videos.
message ListTopVideosResponse {
  // Videos ordered by plays (then watch time) descending.
  repeated TopVideo items = 1;
}

// A single ranked video with its playback totals over the requested range.
message TopVideo {
  // Video ID.
  string video_id = 1;

  // Video title, if set.
  optional string title = 2;

  // Poster image URL, computed from the app's CDN config. Absent when no CDN
  // is configured or the video has no poster.
  optional string poster_url = 3;

  // Total plays over the range.
  int64 plays = 4;

  // Total approximate watch seconds over the range.
  int64 watch_seconds = 5;

  // Unique viewers over the range, summed per day (a viewer active on N days
  // counts N times; exact for a single-day range). See VideoStatsTotals.
  int64 unique_viewers = 6;
}

// =============================================================================
// SEO markup
// =============================================================================

// Request for ready-to-paste SEO markup for a hosted video.
message GetSeoMarkupRequest {
  // Video ID.
  string video_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // Absolute https:// URL of YOUR page that shows the video (the page the
  // markup will be pasted into). Used as the sitemap location and as the base
  // of every chapter deep link.
  string watch_url = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 9, max_len: 2048, prefix: "https://"}
  ];

  // Query parameter your page reads to start playback at a time, in whole
  // seconds. Default: "t", giving chapter links like
  // "https://example.com/watch/42?t=95".
  optional string deep_link_param = 3 [
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^[A-Za-z0-9_-]+$"}
  ];

  // ISO 639-2 language of the transcript and insights to use, when the video
  // has more than one. Default: the video's first generated transcript.
  optional string language = 4 [
    (buf.validate.field).string.pattern = "^[a-z]{3}$"
  ];
}

// Ready-to-paste SEO markup for a hosted video. Every string is complete and
// escaped for its context; paste it as-is.
message GetSeoMarkupResponse {
  // schema.org VideoObject as JSON-LD, ready to place inside
  // `<script type="application/ld+json">`. Includes name, description,
  // thumbnailUrl, uploadDate, duration (ISO 8601), embedUrl and, when the
  // video has ready insights, hasPart Clip key moments from its chapters,
  // each linking to watch_url at the chapter start. thumbnailUrl and embedUrl
  // are stable player URLs that never expire (the thumbnail redirects to the
  // current poster), so the markup can be stored as-is.
  string json_ld = 1;

  // A `<url>` entry for a video sitemap (namespace
  // xmlns:video="http://www.google.com/schemas/sitemap-video/1.1"), to add
  // to your sitemap's `<urlset>`.
  string sitemap_entry = 2;

  // Server-renderable semantic HTML (no scripts, no styles): a
  // `<section class="tx-insights">` with the summary, key points and chapter
  // links (when insights are ready) and the full transcript inside
  // `<details><summary>Transcript</summary>…</details>`. Empty sections are
  // omitted.
  string html_fragment = 3;
}

// =============================================================================
// Insights from existing captions
// =============================================================================

// Request to generate AI insights from a hosted video's existing captions.
message GenerateInsightsRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // ISO 639-2 language of the AI caption track to use (e.g. "eng"). Optional
  // when the video has exactly one AI caption track; required when it has
  // several (refused with code parameter_required, listing the available
  // languages).
  optional string language = 2 [
    (buf.validate.field).string.pattern = "^[a-z]{3}$"
  ];

  // Optional free-text guidance about the content, its audience or the tone
  // you want, at most 300 characters. Same meaning as InsightsOptions.hint.
  optional string hint = 3 [(buf.validate.field).string.max_len = 300];

  // Optional glossary of names and terms as they should be spelled in the
  // insights text, one term per line, at most 4000 characters. Same meaning
  // as InsightsOptions.glossary, minus the caption correction: this pass
  // reads captions that already exist and never rewrites them. No effect on
  // pricing. When absent, the app's default (App.caption_glossary) is used.
  // Echoed as TranscriptInsights.glossary.
  optional string glossary = 5 [(buf.validate.field).string.max_len = 4000];

  // Optional app the video belongs to. API-key callers may omit it (their
  // key's app is used) or pass their own app; a different app is rejected
  // with PermissionDenied. Portal/JWT callers may pass it; omitted, the app
  // is resolved from the video.
  optional string app_id = 4 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];
}

// Response from GenerateInsights.
message GenerateInsightsResponse {
  // The insights entry: newly created, or the one already pending for this
  // video and language. Status is "pending"; poll VideoService.Get (or
  // Watch) or subscribe to video.insights.ready / video.insights.failed.
  TranscriptInsights insights = 1;
}

// =============================================================================
// Caption translation
// =============================================================================

// Request to translate a hosted video's existing AI captions.
message TranslateCaptionsRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // ISO 639-2 language of the AI caption track to translate FROM. Optional
  // when the video has exactly one AI caption track that was not itself a
  // translation; required when it has several (refused with
  // parameter_required, listing the available languages).
  optional string source_language = 2 [
    (buf.validate.field).string.pattern = "^[a-z]{3}$"
  ];

  // Languages to translate INTO (ISO 639-2), 1 to 10, distinct. Both the
  // bibliographic and the terminologic form are accepted; normalized to ISO
  // 639-2/B on the response ("deu" is echoed as "ger").
  repeated string target_languages = 3 [
    (buf.validate.field).repeated = {
      min_items: 1,
      max_items: 10,
      unique: true,
      items: {string: {pattern: "^[a-z]{3}$"}}
    }
  ];

  // Also translate the video's ready insights in source_language, when there
  // are any. Default true. Insights are translated by the API after the job
  // completes, never regenerated.
  optional bool include_insights = 4;

  // Optional app the video belongs to. Same rules as GenerateInsightsRequest.app_id.
  optional string app_id = 5 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];
}

// A target language already being translated by an earlier job.
message TranslationInFlight {
  // ISO 639-2 language (normalized).
  string language = 1;

  // The still-running job (job_…) that carries it.
  string job_id = 2;
}

// Response from TranslateCaptions.
message TranslateCaptionsResponse {
  // The job created for the languages that were not already in flight
  // (job_…). Empty when every requested language was in flight.
  string job_id = 1;

  // The video.
  string video_id = 2;

  // The track language translated from (normalized).
  string source_language = 3;

  // The languages the new job translates into (normalized). Empty when
  // job_id is empty.
  repeated string target_languages = 4;

  // Languages requested that an earlier, still-running job already covers.
  repeated TranslationInFlight in_flight = 5;

  // Estimated fee for the new job in EUR at your effective rate
  // (source minutes × target_languages × rate). 0 when job_id is empty.
  double estimated_fee_eur = 6;

  // Whether the insights in source_language will be translated once the job
  // completes (include_insights and ready source insights exist).
  bool insights_included = 7;
}

// =============================================================================
// Caption restyle
// =============================================================================

// Request to re-cut a hosted video's AI captions into a new cue style.
message RestyleCaptionsRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // ISO 639-2 language of the AI caption track to restyle. Optional when the
  // video has exactly one AI caption track that is not a translation;
  // required when it has several (refused with parameter_required, listing
  // the available languages). Both the bibliographic and the terminologic
  // form are accepted.
  optional string language = 2 [
    (buf.validate.field).string.pattern = "^[a-z]{3}$"
  ];

  // The style to cut the cues in. Optional: when absent, or for the limits it
  // leaves unset, the app's default (App.cue_style) is used, else
  // `standard`, with the same rules as SubtitleTrack.cue_style. So an
  // empty request re-cuts old captions into the current default style.
  optional CueStyle cue_style = 3;

  // Optional app the video belongs to. Same rules as GenerateInsightsRequest.app_id.
  optional string app_id = 4 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];
}

// Response from RestyleCaptions.
message RestyleCaptionsResponse {
  // The captions-only job that re-cuts the track (job_…).
  string job_id = 1;

  // The video.
  string video_id = 2;

  // The language of the track being restyled (normalized to ISO 639-2/B).
  string language = 3;

  // The style the job cuts the cues in, resolved: the preset the limits
  // started from and all three limits.
  CueStyle cue_style = 4;
}

// =============================================================================
// Highlight clips
// =============================================================================

// How highlight clips are chosen from a video's AI insights.
//
// Each quote insights picked (TranscriptInsights.highlights) becomes one
// window: padded by padding_seconds on both sides and kept inside the video;
// a window shorter than min_seconds is extended forward (or, at the end of
// the video, backward) to min_seconds, and one longer than max_seconds is cut
// at max_seconds from its start. Overlapping windows are merged. If more than
// max_count remain, the longest are kept (ties go to the earlier one).
message HighlightsConfig {
  // Create-time option only: true cuts the highlights automatically once the
  // video's AI insights are ready. Ignored by GenerateHighlights, which always
  // cuts them.
  bool enabled = 1;

  // Maximum number of highlights, 1 to 10. Default 5.
  optional int32 max_count = 2 [(buf.validate.field).int32 = {gte: 1, lte: 10}];

  // Shortest highlight in seconds, 1 to 300. Default 8. A video shorter than
  // this yields one highlight of the whole video.
  optional double min_seconds = 3 [(buf.validate.field).double = {gte: 1, lte: 300}];

  // Longest highlight in seconds, 1 to 300, and not below min_seconds.
  // Default 60.
  optional double max_seconds = 4 [(buf.validate.field).double = {gte: 1, lte: 300}];

  // Seconds added before and after each quote so words are not cut off, 0 to
  // 10. Default 1.5.
  optional double padding_seconds = 5 [(buf.validate.field).double = {gte: 0, lte: 10}];
}

// Processing state of a highlight clip.
enum VideoHighlightStatus {
  VIDEO_HIGHLIGHT_STATUS_UNSPECIFIED = 0;

  // Its clip job is queued or rendering.
  VIDEO_HIGHLIGHT_STATUS_PENDING = 1;

  // Rendered; playback_url and poster_url are available.
  VIDEO_HIGHLIGHT_STATUS_READY = 2;

  // Could not be rendered (or was refused); error_code says why. A failed
  // highlight bills nothing.
  VIDEO_HIGHLIGHT_STATUS_FAILED = 3;
}

// One highlight clip of a hosted video (read-only).
message VideoHighlight {
  // Highlight ID (hl_ prefix).
  string id = 1;

  // Where the clip starts and ends in the video, in seconds.
  double start_seconds = 2;
  double end_seconds = 3;

  // The quote the clip was cut around, shortened to at most 120 characters.
  string title = 4;

  // Processing state.
  VideoHighlightStatus status = 5;

  // Why the highlight failed: the clip job's own error code when it has one
  // (for example input_not_found); highlight_render_failed when the job
  // failed or was canceled without one; the refusal's own code (for example
  // billing_past_due or queue_limit_exceeded) when the account refused the
  // job; highlight_job_refused when the job was never created for another
  // reason. Present only when status is "failed".
  //
  // A create-time highlights request that is refused outright is recorded as
  // ONE failed highlight with the refusal's code and start_seconds =
  // end_seconds = 0 (it has no window and no job).
  optional string error_code = 6;

  // Signed (on token-auth apps) MP4 URL of the clip. Present only when status
  // is "ready" and the video's URLs can be issued (the same rules as
  // Video.poster_url).
  optional string playback_url = 7;

  // Poster frame URL, from the first frame of the clip. Same rules as
  // playback_url.
  optional string poster_url = 8;

  // Rendered length in seconds, as measured (to the millisecond when the
  // rendering worker reports it). Present once ready.
  optional double duration_seconds = 9;

  // The clip job that renders it; its cost is this clip's share of the set's
  // one charge. Present once the job was created.
  optional string job_id = 10;

  // Language of the insights the quote came from (ISO 639-2).
  string language = 11;

  // When the highlight was requested.
  google.protobuf.Timestamp created_at = 12;
}

// Request to cut highlight clips from a hosted video.
message GenerateHighlightsRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // ISO 639-2 language of the AI insights to cut from (e.g. "eng"). Optional
  // when the video has ready insights in exactly one language; required when
  // it has several (refused with code parameter_required, listing them).
  optional string language = 2 [
    (buf.validate.field).string.pattern = "^[a-z]{3}$"
  ];

  // How to choose the clips. Omitted fields take their defaults; enabled is
  // ignored here.
  optional HighlightsConfig config = 3;

  // Optional app the video belongs to. API-key callers may omit it (their
  // key's app is used) or pass their own app; a different app is rejected
  // with PermissionDenied. Portal/JWT callers may pass it; omitted, the app
  // is resolved from the video.
  optional string app_id = 4 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];
}

// Response from GenerateHighlights.
message GenerateHighlightsResponse {
  // The video's highlights: the new set, each "pending" (or "failed" when an
  // account limit refused its job), or the set already pending. Poll
  // VideoService.Get (or Watch) or subscribe to video.highlights.ready /
  // video.highlights.failed.
  repeated VideoHighlight highlights = 1;
}
