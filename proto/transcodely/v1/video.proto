// Video service for video hosting and delivery.
// Videos represent hosted media assets with playback, storage tracking, and usage metering.
syntax = "proto3";

package transcodely.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "transcodely/v1/subtitles.proto";

// VideoService manages hosted video assets with upload, playback, and usage tracking.
service VideoService {
  // Create a presigned upload URL for direct browser/client upload.
  // Returns a Video in "uploading" status and a time-limited upload URL.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);

  // Signal that a client-side upload has completed.
  // Triggers processing (probe + transcode) for the uploaded file.
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);

  // Create a hosted video from a publicly-reachable http(s) URL in one call.
  // The API fetches nothing itself: it records the video in "processing" and
  // hands the URL to the transcoding pipeline, which downloads it at run time.
  // Returns a Video in "processing" status (no upload step). Playback/embed
  // URLs populate once the video reaches "ready" (subscribe to video.ready or
  // Watch). The app must have managed hosting enabled.
  rpc CreateFromUrl(CreateFromUrlRequest) returns (CreateFromUrlResponse);

  // Create a multipart upload for large files (up to 5GB).
  // Returns a Video in "uploading" status, an S3 upload_id, and presigned
  // URLs for the first batch of parts (up to 50).
  rpc CreateMultipartUpload(CreateMultipartUploadRequest) returns (CreateMultipartUploadResponse);

  // Get fresh presigned URLs for specific part numbers of an in-progress
  // multipart upload. Use this to fetch URLs in batches or refresh expired ones.
  rpc GetUploadPartUrls(GetUploadPartUrlsRequest) returns (GetUploadPartUrlsResponse);

  // Complete a multipart upload by providing ETags from all uploaded parts.
  // Assembles the parts in S3, then triggers processing (probe + transcode).
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (CompleteMultipartUploadResponse);

  // Abort a multipart upload, cleaning up S3 parts and deleting the video record.
  rpc AbortMultipartUpload(AbortMultipartUploadRequest) returns (AbortMultipartUploadResponse);

  // Get a video by ID.
  rpc Get(GetVideoRequest) returns (GetVideoResponse);

  // List videos with optional filtering.
  rpc List(ListVideosRequest) returns (ListVideosResponse);

  // Update a video's mutable fields (title, description, tags, visibility).
  rpc Update(UpdateVideoRequest) returns (UpdateVideoResponse);

  // Delete a video and all associated storage.
  rpc Delete(DeleteVideoRequest) returns (DeleteVideoResponse);

  // Watch a video for real-time status updates. Streams the current state immediately,
  // then pushes updates as the video progresses through processing.
  // Stream closes automatically when the video reaches a terminal state.
  rpc Watch(WatchVideoRequest) returns (stream WatchVideoResponse);

  // Get usage summary for the current billing period or a specific month.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);

  // Get playback analytics for a single video: plays, watch time, and unique
  // viewers aggregated per UTC day. Stats are collected from a lightweight,
  // best-effort playback beacon and rolled up hourly, so recent activity may
  // lag by up to an hour.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

  // List an app's top videos ranked by plays over a date range.
  rpc ListTopVideos(ListTopVideosRequest) returns (ListTopVideosResponse);

  // Get ready-to-paste SEO markup for showing a video on your own page:
  // schema.org VideoObject JSON-LD (with chapter key moments when the video
  // has insights), a video sitemap entry, and a server-renderable HTML
  // fragment with the summary, chapters and full transcript. The video must be
  // ready and public or unlisted; other videos are refused with
  // failed_precondition.
  rpc GetSeoMarkup(GetSeoMarkupRequest) returns (GetSeoMarkupResponse);

  // Generate AI insights (title suggestions, summary, key points, chapters,
  // questions, key terms, highlights, topics) from a hosted video's existing
  // AI captions, without transcribing again. Billed EUR 0.02 per video plus
  // EUR 0.005 per minute of source, charged only when the insights become
  // ready. Returns the entry in "pending"; it also appears on Video.insights,
  // and video.insights.ready or video.insights.failed fires when it finishes.
  //
  // While an entry for the same video and language is pending, the call
  // returns that entry and bills nothing new. Once it is ready or failed, a
  // new call generates (and bills) a new entry; it replaces the ready one
  // only when it becomes ready itself.
  //
  // Refused with failed_precondition and code captions_required when the
  // video has no AI captions, and insights_transcript_unavailable when the
  // caption track has no transcript.
  rpc GenerateInsights(GenerateInsightsRequest) returns (GenerateInsightsResponse);

  // Cut highlight clips from a hosted video: up to max_count short MP4s
  // (default 5) around the verbatim quotes its ready AI insights picked
  // (TranscriptInsights.highlights; for a translated language, their
  // translations, which keep the same timings and so cut the same windows),
  // rendered at the video's top rendition's
  // codec and resolution. Returns the highlights in "pending"; they also
  // appear on Video.highlights, and video.highlights.ready (or
  // video.highlights.failed, when none could be rendered) fires once every
  // one of them has finished.
  //
  // Each highlight is rendered by its own clip job on the video
  // (input_video_id = the video, with a job-level clip), priced as its
  // rendered (clipped) length, measured to the millisecond, at your effective
  // encoding rate and nothing else: highlight clips carry no per-job
  // processing fee. The set is billed as one charge once every highlight in
  // it is ready or failed: the sum of its ready clips, rounded to the cent
  // once. A failed clip bills nothing. Those jobs count toward your
  // concurrency and queue limits and appear in your job list, each showing
  // its share of the set's charge.
  //
  // While any highlight of the video is pending, the call returns the
  // current highlights and bills nothing new. Once all are ready or failed, a
  // new call replaces them with a new set.
  //
  // Refused with failed_precondition: code highlights_require_insights when
  // the video has no ready AI insights (in the language), and
  // highlights_no_moments when they picked no quote inside the video; also
  // while the video is still processing or when the app's managed hosting is
  // off. Account refusals (spend limit, past due, suspended) are the same as
  // CreateJob's.
  rpc GenerateHighlights(GenerateHighlightsRequest) returns (GenerateHighlightsResponse);

  // Translate a hosted video's existing AI captions into other languages,
  // without transcribing again. Creates one captions-only job on the video
  // (input_video_id = the video) that reads the source track's transcript
  // and writes, per target language: a caption track (replacing any existing
  // auto-generated track of that language on completion), its transcript
  // renditions and, when the video streams as HLS, a caption rendition in
  // the manifest. With include_insights (default true) and ready insights in
  // the source language, the insights are translated too and appear as one
  // more Video.insights entry per language (video.insights.ready fires).
  //
  // Billed as the `captions_translation` fee: EUR 0.12 per source minute per
  // language, charged only for languages actually delivered; nothing else
  // (no captions fee, no per-job processing fee).
  //
  // While a translation job for this video and a target language is still
  // running, that language is not requested again: the response lists it
  // under in_flight with the job that carries it, and the new job (if any)
  // covers only the other languages. Once a job is terminal, a new call
  // translates (and bills) again and replaces the tracks.
  //
  // Refused with failed_precondition and code captions_required when the
  // video has no AI captions, insights_transcript_unavailable when the
  // source track has no transcript, and with invalid_argument
  // (parameter_invalid) when a target equals the source language or is not a
  // supported translation language (the violation lists the supported codes).
  // Refused with failed_precondition and code captions_job_in_flight while a
  // RestyleCaptions job on the source language is still running (it is about
  // to replace the cues the translation would follow); the message names
  // that job. Deployments without the feature refuse it with
  // `parameter_unsupported`.
  // Account refusals (spend limit, past due, suspended) are the same as
  // CreateJob's. Refused with unavailable and code translation_busy when the
  // call could not start within about 10 seconds because other caption
  // translations (of this video, or many at once) were being started at the
  // same moment: nothing was created or billed, and the same request can be
  // retried after a few seconds.
  //
  // Privacy: the caption TEXT (never the audio or video) is sent to Anthropic,
  // our AI subprocessor, to produce the translation; it is not used to train
  // models. Requesting a translation also enables the AI correction pass
  // described under SubtitleTrack.insights (same subprocessor, no charge).
  rpc TranslateCaptions(TranslateCaptionsRequest) returns (TranslateCaptionsResponse);

  // Re-cuts a hosted video's existing AI captions into cues of a new cue
  // style (CueStyle), without transcribing again. The words and their
  // timings come from the track's stored transcript; only how they are
  // grouped into cues changes. Creates a captions-only job on the video
  // (job_id in the response; follow it with JobService.Get or the job.*
  // webhooks). When the job completes, the track's caption file, its
  // transcript renditions and, when the video's HLS stream carries the
  // language, its stream rendition are replaced in place, the track's
  // updated_at moves and VideoTextTrack.cue_style shows the new style.
  // Insights are kept as they are (the words do not change).
  //
  // Translations of the track are not re-cut: they keep their cues, and
  // their source track's newer updated_at marks them as made from captions
  // that have since changed. Translate again (TranslateCaptions) to bring
  // them onto the new cues.
  //
  // Free: no captions, translation or processing fee is charged.
  //
  // Deployments whose workers do not cut by cue style yet refuse it with
  // invalid_argument and code `parameter_unsupported` on cue_style.
  //
  // Refused with failed_precondition and code captions_required when the
  // video has no AI captions or the chosen track is itself a translation,
  // insights_transcript_unavailable when the track has no transcript, and
  // captions_job_in_flight when a captions job (generation, translation or
  // another restyle) of the same language is still running on the video;
  // the message names that job. Refused with unavailable and code
  // translation_busy when the call could not start within about 10 seconds
  // because other caption jobs on the video were being started at the same
  // moment: nothing was created, and the same request can be retried after a
  // few seconds. Account refusals are the same as CreateJob's.
  rpc RestyleCaptions(RestyleCaptionsRequest) returns (RestyleCaptionsResponse);
}

// =============================================================================
// Enums
// =============================================================================

// Video lifecycle status.
enum VideoStatus {
  // Default value, should not be used.
  VIDEO_STATUS_UNSPECIFIED = 0;

  // Upload in progress (presigned URL issued, awaiting CompleteUpload).
  VIDEO_STATUS_UPLOADING = 1;

  // Video is being processed (probe, transcode, packaging).
  VIDEO_STATUS_PROCESSING = 2;

  // Video is ready for playback.
  VIDEO_STATUS_READY = 3;

  // Processing failed.
  VIDEO_STATUS_ERROR = 4;

  // Video has been archived (not actively served, storage retained).
  VIDEO_STATUS_ARCHIVED = 5;

  // Video has been deleted (pending cleanup).
  VIDEO_STATUS_DELETED = 6;
}

// Video visibility controls who can access the video.
enum VideoVisibility {
  // Default value, should not be used.
  VIDEO_VISIBILITY_UNSPECIFIED = 0;

  // Anyone with the playback URL can view.
  VIDEO_VISIBILITY_PUBLIC = 1;

  // Accessible only via direct link (not listed in public indexes).
  VIDEO_VISIBILITY_UNLISTED = 2;

  // Not playable via the public player or embed: the player page returns 404 and
  // embed_url/embed_code are never populated. Authenticated API reads
  // (VideoService.Get/List/Watch) for the owning app DO return signed, expiring
  // playback_url/poster_url once the video is "ready", so the owner can watch a
  // private video via the API even though it stays off the public player.
  VIDEO_VISIBILITY_PRIVATE = 3;
}

// =============================================================================
// Resources
// =============================================================================

// One line of a video's cost breakdown (Video.cost_breakdown): how much of
// Video.total_cost one kind of charge accounts for.
message VideoCostLine {
  // What the line is for, a lowercase string:
  //   "encoding"             — the transcoding work itself: what is left of
  //                            the video's jobs' settled totals after every
  //                            other line is taken out. That covers the
  //                            output (rendition) costs and, on jobs created
  //                            before August 2026, the minimum-charge floor.
  //                            Never negative. A job's settled total always
  //                            includes its fees, so the remainder cannot go
  //                            below zero; if inconsistent data ever made it
  //                            negative, the line is omitted (clamped to zero)
  //                            and nothing else is adjusted.
  //   "processing"           — the flat per-job processing fee of each job
  //                            run for the video.
  //   "captions"             — AI caption generation, inline with the
  //                            transcode or a later captions job.
  //   "captions_translation" — caption translation into other languages.
  //   "insights"             — AI insights, both the per-minute and the
  //                            per-video part, whether requested with the
  //                            captions or later via GenerateInsights.
  //   "highlights"           — highlight clips: the whole settled total of
  //                            each clip job cut from the video.
  // New kinds can be added when a new kind of charge is introduced, so show
  // an unrecognized kind as a generic line rather than dropping it; dropping
  // it would make the lines stop adding up to total_cost.
  string kind = 1;

  // The amount in EUR, the currency of total_cost. Always greater than zero.
  double amount = 2;
}

// A hosted video asset with playback, storage, and cost tracking.
message Video {
  // Unique video identifier (e.g., "vid_a1b2c3d4e5f6").
  string id = 1;

  // App that owns this video.
  string app_id = 2;

  // How the video was created: "upload" (direct upload or CreateFromUrl ingest)
  // or "job" (from a managed transcoding job created via JobService.Create).
  string source = 3;

  // Current lifecycle status.
  string status = 4;

  // Visibility setting.
  string visibility = 5;

  // Content metadata
  optional string title = 6;
  optional string description = 7;
  repeated string tags = 8;

  // Input file details
  optional int64 input_size_bytes = 10;
  optional string input_content_type = 11;

  // Linked transcoding job (set when source is "job" or after upload triggers transcoding).
  optional string job_id = 15;

  // Preset reference used to drive auto-transcoding for this video, if any.
  // Either a preset ID (e.g., "pst_abc123") or slug (e.g., "gaming_1080p_60_standard").
  // Set via CreateUpload; if absent the app's default auto-profile is used.
  optional string preset = 16;

  // Playback surface — all computed per-request and never stored. Populated for
  // "ready" videos of any visibility (public, unlisted, and — on authenticated
  // owner reads — private); absent otherwise. On apps with CDN token auth
  // enabled the URL is signed and expiring (HMAC token + expiry query params);
  // it is re-issued on every read, so clients should use the value from the
  // latest response rather than caching it. On apps not yet migrated to token
  // auth the URL is unsigned and access control comes from the managed-storage
  // bucket policy; unsigned URLs are never issued for private videos.
  optional string playback_url = 20;
  // Public embed surface — populated only for playable videos (status "ready"
  // and NOT private). Always absent for private videos.
  optional string embed_url = 21;
  // Ready-to-paste responsive HTML embed snippet: a 16:9 aspect-ratio wrapper
  // div containing a lazy-loaded, borderless <iframe src=embed_url> that fills
  // its container (no fixed width/height). Same population rules as embed_url.
  optional string embed_code = 22;
  // Poster image URL, resolved from the worker-reported poster key. Signed and
  // expiring on token-auth apps, unsigned otherwise — same rules and per-request
  // re-issuance as playback_url. Absent when the video has no generated poster.
  optional string poster_url = 23;
  optional double duration_seconds = 24;

  // Animated hover-preview URLs, populated when the video was created with
  // hover_previews enabled and its transcode produced the animated artifacts.
  // Same resolution and per-request re-issuance rules as poster_url: signed and
  // expiring on token-auth apps, unsigned otherwise, absent for private videos
  // without a signable key. hover_preview_url is the animated WebP; the muted
  // MP4 loop rides hover_preview_mp4_url. Either may be absent (e.g. the WebP is
  // skipped for previews longer than 10 s). Field numbers 44/45.
  optional string hover_preview_url = 44;
  optional string hover_preview_mp4_url = 45;

  // Renditions available for playback.
  repeated VideoRendition renditions = 25;

  // Caption/subtitle tracks attached to this video, in the order they were
  // attached. Populated for videos whose transcode produced caption files —
  // either in the same job or by a later captions-only job. Empty otherwise.
  repeated VideoTextTrack text_tracks = 49;

  // AI insights for this video, one per transcript language, from the
  // captions job that requested them (SubtitleTrack.insights) or from
  // GenerateInsights. Each moves from "pending" to "ready" or "failed". A
  // GenerateInsights entry still pending for a language that already has
  // ready insights is listed first, ahead of the ready entry it will replace.
  // If that entry fails, the ready insights stay and the failed entry is no
  // longer listed; video.insights.failed reports it.
  // Signed URLs are computed per request under the same rules as text track
  // URLs and are never stored.
  repeated TranscriptInsights insights = 53;

  // Highlight clips of this video, in the order they occur in it: short MP4s
  // cut around the quotes its AI insights picked, from GenerateHighlights or
  // the create-time highlights option. Each moves from "pending" to "ready"
  // or "failed". Empty until highlights are requested. A new
  // GenerateHighlights call replaces the whole list. Signed URLs are
  // computed per request under the same rules as poster_url and are never
  // stored.
  repeated VideoHighlight highlights = 54;

  // Storage and cost transparency.
  int64 output_size_bytes = 30;
  // Total billed by the transcode job that produced this video, in EUR.
  //
  // Despite the name this is the job's WHOLE total, not encoding alone: a
  // job's total already includes every fee billed on it, so for a video
  // captioned inline (the auto_captions upload flag) the captions fee is part
  // of this number, as is the flat per-job processing fee. Absent until the
  // job settles.
  //
  // Prefer total_cost. This field covers one job, so it misses the cost of
  // later jobs run against the video, and adding captions_cost to it
  // double-counts inline captions.
  optional double encoding_cost = 31;
  // Sum of confirmed AI-caption fees, in EUR, across all of this video's jobs
  // — captions generated inline with the transcode (the auto_captions upload
  // flag) and retro captions-only jobs that used this video as their input
  // (input_video_id). Absent until a captions fee is confirmed; fees are
  // confirmed only when a caption artifact is actually delivered, so voided
  // and still-estimated fees are never counted. This is a per-feature
  // breakdown of already-billed job totals, not an extra charge on top of
  // them: it is contained in total_cost, never added to it.
  //
  // Kept for compatibility: cost_breakdown's "captions" line carries the same
  // amount once every linked job has settled, and is the one to read.
  optional double captions_cost = 50;
  // Everything this video has cost, in EUR: the sum of the settled totals of
  // every job billed for it — the transcode that produced it plus any later
  // job that took it as input (retro captions, for example) — plus the fee of
  // every ready GenerateInsights entry (TranscriptInsights.fee_eur).
  //
  // This is the authoritative per-video figure and the one to display. It is
  // built from the same amounts the billing ledger is written from, so it
  // reconciles with the invoice; captions_cost is a breakdown inside it.
  // Absent while nothing linked to the video has been billed yet.
  optional double total_cost = 52;
  // What total_cost is made of, one line per kind of charge, for showing a
  // small itemized breakdown next to the total. Lines are listed in a fixed
  // order (encoding, processing, captions, captions_translation, insights,
  // highlights, then any other kind) and a kind appears at most once.
  //
  // The lines add up to total_cost (the one exception, on inconsistent data
  // only, is described under VideoCostLine.kind "encoding"). Every amount is
  // an exact sum of the same 6-decimal EUR amounts total_cost is summed
  // from, with no rounding, so the sum matches total_cost to the cent and
  // beyond. Round each line only
  // for display; rounding lines independently can differ from the rounded
  // total by a cent, so show total_cost itself as the total.
  //
  // Only settled amounts count, under the same rules as total_cost: jobs
  // without a settled total are left out, and estimated or voided fees never
  // appear. Lines whose amount is zero are omitted. Empty exactly when
  // total_cost is absent.
  //
  // Filled on every read that fills total_cost (GetVideo and ListVideos
  // included). Empty in webhook event payloads, which also omit total_cost
  // and captions_cost: event snapshots are taken without the per-video cost
  // read, so each event does not pay for an extra query.
  repeated VideoCostLine cost_breakdown = 59;

  // Why this video failed, in one sentence a customer can act on. Present only
  // when status is "error"; absent for every other status.
  //
  // This is curated copy, never raw failure text — it will not contain
  // encoder output, storage-provider responses, or internal identifiers. When
  // the video has a linked job, that job's error_message says the same thing.
  optional string error_message = 51;
  // Fields 32 (storage_cost_monthly) and 33 (egress_total) were removed: no
  // per-video storage/egress cost is tracked, so they were never populated.
  // Aggregate storage/egress cost is exposed via VideoService.GetUsage
  // (UsageSummary). Reserved to prevent reuse.
  reserved 32, 33;

  // Timestamps.
  google.protobuf.Timestamp created_at = 40;
  google.protobuf.Timestamp updated_at = 41;
  optional google.protobuf.Timestamp ready_at = 42;

  // Source lifecycle (managed hosting only). These concern ONLY the original
  // source file (an upload, or the copy stored for a URL-ingested video);
  // renditions and playback are never affected.
  //
  // Whether this video's source file is retained. Source files are deleted
  // when the app's retention window ends (HostingConfig.delete_source_after_days,
  // 7 days after the video is ready by default); a pinned source is kept until
  // it is unpinned or the video is deleted. Retained sources are billed as
  // hosted storage at the standard storage rate and appear on the invoice as
  // "Retained source videos". Set via UpdateVideo.
  bool source_pinned = 46;

  // When the source file is scheduled to be deleted. Server-set, read-only;
  // present only while a deletion is scheduled, which happens at least 72
  // hours ahead and sends the video.source_scheduled_for_deletion webhook
  // (cleared on pin, on a retention setting change, and on delete).
  optional google.protobuf.Timestamp source_scheduled_for_deletion_at = 47;

  // When the source file was deleted. Server-set, read-only. Once set,
  // re-processing can only use a progressive (single-file) rendition, and a
  // video with only HLS/DASH renditions needs its source uploaded again.
  optional google.protobuf.Timestamp source_deleted_at = 48;

  // When the source file will be deleted, server-computed: the scheduled
  // deletion time once one is set, otherwise ready_at plus the app's retention
  // window, and never sooner than 72 hours from now. Absent when the source is
  // pinned, already deleted, or not deleted by retention at all (the video is
  // not ready, or has no stored source). Read-only.
  optional google.protobuf.Timestamp source_expires_at = 55;

  // Guide page: a hosted, shareable page for this video at
  // <player base>/v/{id}/guide — the player on top, its AI insights
  // (summary, chapters, key points, questions, highlights, terms, topics)
  // and the full transcript with timestamps that seek the player, in the
  // language of the caption track, with Open Graph and schema.org VideoObject
  // markup. It exists only for a public or unlisted video that has ready
  // insights or a generated transcript; a private video never gets one.
  //
  // guide_page_enabled is the EFFECTIVE setting: on when guide_page is "on",
  // off when it is "off", and the app's HostingConfig.guide_pages_enabled
  // default (unset meaning false) when it is "default". Server-set, and
  // present on every VideoService response (reads, updates, creates, Watch).
  //
  // Absent in video.* webhook payloads: a webhook snapshot does not resolve
  // the app default. Read guide_page there (exact in every payload), or call
  // GetVideo for the effective value and guide_url.
  optional bool guide_page_enabled = 56;

  // The guide page URL. Present only when the page would render:
  // guide_page_enabled is true, the video is playable (status "ready" and not
  // private, the embed_url rule), and it has ready insights or a generated
  // transcript to show. Durable: it never expires.
  optional string guide_url = 57;

  // This video's own guide page setting: "default" follows the app's
  // HostingConfig.guide_pages_enabled (so a later change to the app default
  // moves it), "on" and "off" pin it. Set it through UpdateVideo.guide_page;
  // guide_page_enabled is the resulting effective value. Present on every
  // Video, webhook payloads included.
  GuidePageSetting guide_page = 58;

  // Resource type discriminator. Always "video" for this message.
  // Lets webhook consumers and polyglot SDKs identify the resource without
  // out-of-band knowledge of the field name. Server-set; ignored on requests.
  string object = 43;
}

// A single encoded rendition of a video.
message VideoRendition {
  // Unique rendition identifier (e.g., "ren_a1b2c3d4e5f6").
  string id = 1;

  // Resolution label (e.g., "1080p", "720p").
  string resolution = 2;

  // Video codec used (e.g., "h264", "h265").
  string codec = 3;

  // Average bitrate in kilobits per second.
  int32 bitrate_kbps = 4;

  // Frame width in pixels.
  int32 width = 5;

  // Frame height in pixels.
  int32 height = 6;

  // Encoded file size in bytes.
  int64 size_bytes = 7;
}

// A caption/subtitle track attached to a video for playback.
message VideoTextTrack {
  // Unique text track identifier (e.g., "trk_a1b2c3d4e5f6g7").
  string id = 1;

  // Track role, as understood by players: "subtitles", "captions", "chapters",
  // or "descriptions".
  string kind = 2;

  // Language of the track: the ISO 639-2 code that was requested, or the code
  // detected by speech recognition when the track was generated with "auto".
  // Empty when the producing job recorded no language.
  string language = 3;

  // Human-readable track label shown in the player's caption menu (e.g.
  // "English"). Empty when none was supplied.
  string label = 4;

  // Subtitle file format: "webvtt", "srt", "ttml", or "ass".
  string format = 5;

  // Whether the track was produced by speech recognition (a subtitle track with
  // the "generate" operation) rather than supplied or extracted from the source.
  bool auto_generated = 6;

  // Whether the track is already listed inside the video's HLS/DASH manifest.
  // When true, players discover it from the manifest during normal playback and
