// Video service for video hosting and delivery.
// Videos represent hosted media assets with playback, storage tracking, and usage metering.
syntax = "proto3";

package transcodely.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "transcodely/v1/subtitles.proto";

// VideoService manages hosted video assets with upload, playback, and usage tracking.
service VideoService {
  // Create a presigned upload URL for direct browser/client upload.
  // Returns a Video in "uploading" status and a time-limited upload URL.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);

  // Signal that a client-side upload has completed.
  // Triggers processing (probe + transcode) for the uploaded file.
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);

  // Create a hosted video from a publicly-reachable http(s) URL in one call.
  // The API fetches nothing itself: it records the video in "processing" and
  // hands the URL to the transcoding pipeline, which downloads it at run time.
  // Returns a Video in "processing" status (no upload step). Playback/embed
  // URLs populate once the video reaches "ready" (subscribe to video.ready or
  // Watch). The app must have managed hosting enabled.
  rpc CreateFromUrl(CreateFromUrlRequest) returns (CreateFromUrlResponse);

  // Create a multipart upload for large files (up to 5GB).
  // Returns a Video in "uploading" status, an S3 upload_id, and presigned
  // URLs for the first batch of parts (up to 50).
  rpc CreateMultipartUpload(CreateMultipartUploadRequest) returns (CreateMultipartUploadResponse);

  // Get fresh presigned URLs for specific part numbers of an in-progress
  // multipart upload. Use this to fetch URLs in batches or refresh expired ones.
  rpc GetUploadPartUrls(GetUploadPartUrlsRequest) returns (GetUploadPartUrlsResponse);

  // Complete a multipart upload by providing ETags from all uploaded parts.
  // Assembles the parts in S3, then triggers processing (probe + transcode).
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (CompleteMultipartUploadResponse);

  // Abort a multipart upload, cleaning up S3 parts and deleting the video record.
  rpc AbortMultipartUpload(AbortMultipartUploadRequest) returns (AbortMultipartUploadResponse);

  // Get a video by ID.
  rpc Get(GetVideoRequest) returns (GetVideoResponse);

  // List videos with optional filtering.
  rpc List(ListVideosRequest) returns (ListVideosResponse);

  // Update a video's mutable fields (title, description, tags, visibility).
  rpc Update(UpdateVideoRequest) returns (UpdateVideoResponse);

  // Delete a video and all associated storage.
  rpc Delete(DeleteVideoRequest) returns (DeleteVideoResponse);

  // Watch a video for real-time status updates. Streams the current state immediately,
  // then pushes updates as the video progresses through processing.
  // Stream closes automatically when the video reaches a terminal state.
  rpc Watch(WatchVideoRequest) returns (stream WatchVideoResponse);

  // Get usage summary for the current billing period or a specific month.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);

  // Get playback analytics for a single video: plays, watch time, and unique
  // viewers aggregated per UTC day. Stats are collected from a lightweight,
  // best-effort playback beacon and rolled up hourly, so recent activity may
  // lag by up to an hour.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

  // List an app's top videos ranked by plays over a date range.
  rpc ListTopVideos(ListTopVideosRequest) returns (ListTopVideosResponse);

  // Get ready-to-paste SEO markup for showing a video on your own page:
  // schema.org VideoObject JSON-LD (with chapter key moments when the video
  // has insights), a video sitemap entry, and a server-renderable HTML
  // fragment with the summary, chapters and full transcript. The video must be
  // ready and public or unlisted; other videos are refused with
  // failed_precondition.
  rpc GetSeoMarkup(GetSeoMarkupRequest) returns (GetSeoMarkupResponse);

  // Generate AI insights (title suggestions, summary, key points, chapters,
  // questions, key terms, highlights, topics) from a hosted video's existing
  // AI captions, without transcribing again. Billed EUR 0.02 per video plus
  // EUR 0.005 per minute of source, charged only when the insights become
  // ready. Returns the entry in "pending"; it also appears on Video.insights,
  // and video.insights.ready or video.insights.failed fires when it finishes.
  //
  // While an entry for the same video and language is pending, the call
  // returns that entry and bills nothing new. Once it is ready or failed, a
  // new call generates (and bills) a new entry; it replaces the ready one
  // only when it becomes ready itself.
  //
  // Refused with failed_precondition and code captions_required when the
  // video has no AI captions, and insights_transcript_unavailable when the
  // caption track has no transcript.
  rpc GenerateInsights(GenerateInsightsRequest) returns (GenerateInsightsResponse);

  // Cut highlight clips from a hosted video: up to max_count short MP4s
  // (default 5) around the verbatim quotes its ready AI insights picked
  // (TranscriptInsights.highlights), rendered at the video's top rendition's
  // codec and resolution. Returns the highlights in "pending"; they also
  // appear on Video.highlights, and video.highlights.ready (or
  // video.highlights.failed, when none could be rendered) fires once every
  // one of them has finished.
  //
  // Each highlight is rendered by its own clip job on the video
  // (input_video_id = the video, with a job-level clip), billed as its
  // rendered (clipped) minutes at your effective encoding rate and nothing
  // else: highlight clips carry no per-job processing fee. Those jobs count
  // toward your concurrency and queue limits and appear in your job list.
  //
  // While any highlight of the video is pending, the call returns the
  // current highlights and bills nothing new. Once all are ready or failed, a
  // new call replaces them with a new set.
  //
  // Refused with failed_precondition: code highlights_require_insights when
  // the video has no ready AI insights (in the language), and
  // highlights_no_moments when they picked no quote inside the video; also
  // while the video is still processing or when the app's managed hosting is
  // off. Account refusals (spend limit, past due, suspended) are the same as
  // CreateJob's.
  rpc GenerateHighlights(GenerateHighlightsRequest) returns (GenerateHighlightsResponse);
}

// =============================================================================
// Enums
// =============================================================================

// Video lifecycle status.
enum VideoStatus {
  // Default value, should not be used.
  VIDEO_STATUS_UNSPECIFIED = 0;

  // Upload in progress (presigned URL issued, awaiting CompleteUpload).
  VIDEO_STATUS_UPLOADING = 1;

  // Video is being processed (probe, transcode, packaging).
  VIDEO_STATUS_PROCESSING = 2;

  // Video is ready for playback.
  VIDEO_STATUS_READY = 3;

  // Processing failed.
  VIDEO_STATUS_ERROR = 4;

  // Video has been archived (not actively served, storage retained).
  VIDEO_STATUS_ARCHIVED = 5;

  // Video has been deleted (pending cleanup).
  VIDEO_STATUS_DELETED = 6;
}

// Video visibility controls who can access the video.
enum VideoVisibility {
  // Default value, should not be used.
  VIDEO_VISIBILITY_UNSPECIFIED = 0;

  // Anyone with the playback URL can view.
  VIDEO_VISIBILITY_PUBLIC = 1;

  // Accessible only via direct link (not listed in public indexes).
  VIDEO_VISIBILITY_UNLISTED = 2;

  // Not playable via the public player or embed: the player page returns 404 and
  // embed_url/embed_code are never populated. Authenticated API reads
  // (VideoService.Get/List/Watch) for the owning app DO return signed, expiring
  // playback_url/poster_url once the video is "ready", so the owner can watch a
  // private video via the API even though it stays off the public player.
  VIDEO_VISIBILITY_PRIVATE = 3;
}

// =============================================================================
// Resources
// =============================================================================

// A hosted video asset with playback, storage, and cost tracking.
message Video {
  // Unique video identifier (e.g., "vid_a1b2c3d4e5f6").
  string id = 1;

  // App that owns this video.
  string app_id = 2;

  // How the video was created: "upload" (direct upload or CreateFromUrl ingest)
  // or "job" (from a managed transcoding job created via JobService.Create).
  string source = 3;

  // Current lifecycle status.
  string status = 4;

  // Visibility setting.
  string visibility = 5;

  // Content metadata
  optional string title = 6;
  optional string description = 7;
  repeated string tags = 8;

  // Input file details
  optional int64 input_size_bytes = 10;
  optional string input_content_type = 11;

  // Linked transcoding job (set when source is "job" or after upload triggers transcoding).
  optional string job_id = 15;

  // Preset reference used to drive auto-transcoding for this video, if any.
  // Either a preset ID (e.g., "pst_abc123") or slug (e.g., "gaming_1080p_60_standard").
  // Set via CreateUpload; if absent the app's default auto-profile is used.
  optional string preset = 16;

  // Playback surface — all computed per-request and never stored. Populated for
  // "ready" videos of any visibility (public, unlisted, and — on authenticated
  // owner reads — private); absent otherwise. On apps with CDN token auth
  // enabled the URL is signed and expiring (HMAC token + expiry query params);
  // it is re-issued on every read, so clients should use the value from the
  // latest response rather than caching it. On apps not yet migrated to token
  // auth the URL is unsigned and access control comes from the managed-storage
  // bucket policy; unsigned URLs are never issued for private videos.
  optional string playback_url = 20;
  // Public embed surface — populated only for playable videos (status "ready"
  // and NOT private). Always absent for private videos.
  optional string embed_url = 21;
  // Ready-to-paste responsive HTML embed snippet: a 16:9 aspect-ratio wrapper
  // div containing a lazy-loaded, borderless <iframe src=embed_url> that fills
  // its container (no fixed width/height). Same population rules as embed_url.
  optional string embed_code = 22;
  // Poster image URL, resolved from the worker-reported poster key. Signed and
  // expiring on token-auth apps, unsigned otherwise — same rules and per-request
  // re-issuance as playback_url. Absent when the video has no generated poster.
  optional string poster_url = 23;
  optional double duration_seconds = 24;

  // Animated hover-preview URLs, populated when the video was created with
  // hover_previews enabled and its transcode produced the animated artifacts.
  // Same resolution and per-request re-issuance rules as poster_url: signed and
  // expiring on token-auth apps, unsigned otherwise, absent for private videos
  // without a signable key. hover_preview_url is the animated WebP; the muted
  // MP4 loop rides hover_preview_mp4_url. Either may be absent (e.g. the WebP is
  // skipped for previews longer than 10 s). Field numbers 44/45.
  optional string hover_preview_url = 44;
  optional string hover_preview_mp4_url = 45;

  // Renditions available for playback.
  repeated VideoRendition renditions = 25;

  // Caption/subtitle tracks attached to this video, in the order they were
  // attached. Populated for videos whose transcode produced caption files —
  // either in the same job or by a later captions-only job. Empty otherwise.
  repeated VideoTextTrack text_tracks = 49;

  // AI insights for this video, one per transcript language, from the
  // captions job that requested them (SubtitleTrack.insights) or from
  // GenerateInsights. Each moves from "pending" to "ready" or "failed". A
  // GenerateInsights entry still pending for a language that already has
  // ready insights is listed first, ahead of the ready entry it will replace.
  // If that entry fails, the ready insights stay and the failed entry is no
  // longer listed; video.insights.failed reports it.
  // Signed URLs are computed per request under the same rules as text track
  // URLs and are never stored.
  repeated TranscriptInsights insights = 53;

  // Highlight clips of this video, in the order they occur in it: short MP4s
  // cut around the quotes its AI insights picked, from GenerateHighlights or
  // the create-time highlights option. Each moves from "pending" to "ready"
  // or "failed". Empty until highlights are requested. A new
  // GenerateHighlights call replaces the whole list. Signed URLs are
  // computed per request under the same rules as poster_url and are never
  // stored.
  repeated VideoHighlight highlights = 54;

  // Storage and cost transparency.
  int64 output_size_bytes = 30;
  // Total billed by the transcode job that produced this video, in EUR.
  //
  // Despite the name this is the job's WHOLE total, not encoding alone: a
  // job's total already includes every fee billed on it, so for a video
  // captioned inline (the auto_captions upload flag) the captions fee is part
  // of this number, as is the flat per-job processing fee. Absent until the
  // job settles.
  //
  // Prefer total_cost. This field covers one job, so it misses the cost of
  // later jobs run against the video, and adding captions_cost to it
  // double-counts inline captions.
  optional double encoding_cost = 31;
  // Sum of confirmed AI-caption fees, in EUR, across all of this video's jobs
  // — captions generated inline with the transcode (the auto_captions upload
  // flag) and retro captions-only jobs that used this video as their input
  // (input_video_id). Absent until a captions fee is confirmed; fees are
  // confirmed only when a caption artifact is actually delivered, so voided
  // and still-estimated fees are never counted. This is a per-feature
  // breakdown of already-billed job totals, not an extra charge on top of
  // them: it is contained in total_cost, never added to it.
  optional double captions_cost = 50;
  // Everything this video has cost, in EUR: the sum of the settled totals of
  // every job billed for it — the transcode that produced it plus any later
  // job that took it as input (retro captions, for example) — plus the fee of
  // every ready GenerateInsights entry (TranscriptInsights.fee_eur).
  //
  // This is the authoritative per-video figure and the one to display. It is
  // built from the same amounts the billing ledger is written from, so it
  // reconciles with the invoice; captions_cost is a breakdown inside it.
  // Absent while nothing linked to the video has been billed yet.
  optional double total_cost = 52;

  // Why this video failed, in one sentence a customer can act on. Present only
  // when status is "error"; absent for every other status.
  //
  // This is curated copy, never raw failure text — it will not contain
  // encoder output, storage-provider responses, or internal identifiers. When
  // the video has a linked job, that job's error_message says the same thing.
  optional string error_message = 51;
  // Fields 32 (storage_cost_monthly) and 33 (egress_total) were removed: no
  // per-video storage/egress cost is tracked, so they were never populated.
  // Aggregate storage/egress cost is exposed via VideoService.GetUsage
  // (UsageSummary). Reserved to prevent reuse.
  reserved 32, 33;

  // Timestamps.
  google.protobuf.Timestamp created_at = 40;
  google.protobuf.Timestamp updated_at = 41;
  optional google.protobuf.Timestamp ready_at = 42;

  // Source lifecycle (managed hosting only). These concern ONLY the original
  // uploaded source file; renditions and playback are never affected.
  //
  // Whether this video's source file is exempt from the app's
  // delete_source_after_days lifecycle rule. Set via UpdateVideo.
  bool source_pinned = 46;

  // When the source file is scheduled to be deleted by the app's
  // delete_source_after_days rule. Server-set, read-only; present only while a
  // deletion is scheduled (cleared on pin, on setting change, and on delete).
  optional google.protobuf.Timestamp source_scheduled_for_deletion_at = 47;

  // When the source file was deleted by the lifecycle rule. Server-set,
  // read-only. Once set, re-processing falls back to the best rendition.
  optional google.protobuf.Timestamp source_deleted_at = 48;

  // Resource type discriminator. Always "video" for this message.
  // Lets webhook consumers and polyglot SDKs identify the resource without
  // out-of-band knowledge of the field name. Server-set; ignored on requests.
  string object = 43;
}

// A single encoded rendition of a video.
message VideoRendition {
  // Unique rendition identifier (e.g., "ren_a1b2c3d4e5f6").
  string id = 1;

  // Resolution label (e.g., "1080p", "720p").
  string resolution = 2;

  // Video codec used (e.g., "h264", "h265").
  string codec = 3;

  // Average bitrate in kilobits per second.
  int32 bitrate_kbps = 4;

  // Frame width in pixels.
  int32 width = 5;

  // Frame height in pixels.
  int32 height = 6;

  // Encoded file size in bytes.
  int64 size_bytes = 7;
}

// A caption/subtitle track attached to a video for playback.
message VideoTextTrack {
  // Unique text track identifier (e.g., "trk_a1b2c3d4e5f6g7").
  string id = 1;

  // Track role, as understood by players: "subtitles", "captions", "chapters",
  // or "descriptions".
  string kind = 2;

  // Language of the track: the ISO 639-2 code that was requested, or the code
  // detected by speech recognition when the track was generated with "auto".
  // Empty when the producing job recorded no language.
  string language = 3;

  // Human-readable track label shown in the player's caption menu (e.g.
  // "English"). Empty when none was supplied.
  string label = 4;

  // Subtitle file format: "webvtt", "srt", "ttml", or "ass".
  string format = 5;

  // Whether the track was produced by speech recognition (a subtitle track with
  // the "generate" operation) rather than supplied or extracted from the source.
  bool auto_generated = 6;

  // Whether the track is already listed inside the video's HLS/DASH manifest.
  // When true, players discover it from the manifest during normal playback and
  // must NOT also attach it as a separate track — doing so lists the language
  // twice. False for tracks produced by a captions-only job that ran after the
  // transcode, which are attached as sidecar files instead.
  bool in_manifest = 7;

  // URL of the caption file. Computed per-request and never stored: on apps with
  // CDN token auth enabled it is signed and expiring, and it is re-issued on
  // every read, so clients should use the value from the latest response rather
  // than caching it. On apps not yet migrated to token auth it is unsigned and
  // access control comes from the managed-storage bucket policy; unsigned URLs
  // are never issued for private videos. Absent when no URL may be issued —
  // same rules as poster_url.
  optional string url = 8;

  // When the track was attached to the video.
  google.protobuf.Timestamp created_at = 9;

  // Transcript renditions of an auto-generated track, one per format (json,
  // txt, md). Empty for tracks that were not generated by speech recognition
  // and for tracks generated before renditions existed. Each signed_url is
  // computed per request under exactly the same rules as url and is never
  // stored.
  repeated TranscriptRendition transcript_renditions = 10;
}

// =============================================================================
// Upload RPCs
// =============================================================================

// Request to create a presigned upload URL for direct client upload.
//
// Managed hosting is enabled for the app the first time a video is created —
// there is no dashboard step and no AppService.EnableHosting call to make
// first. That first request provisions the app's storage bucket, its managed
// origin and its CDN pull zone, so it can take a few seconds longer than the
// ones after it. If provisioning fails the request is rejected with error code
// `hosting_provisioning_failed` (gRPC `unavailable`) and no video is created;
// the request is safe to retry unchanged.
message CreateUploadRequest {
  // App to create the video under. API-key callers may omit it (their key's app
  // is used) or pass their own app; a different app is rejected with
  // PermissionDenied. Portal/JWT callers pass it to create in a specific app in
  // their org; omitted selects the org's first active app.
  //
  // Managed hosting does not have to be enabled on it first — see the note on
  // this message; the call enables it.
  string app_id = 8 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];

  // Original filename (used for content-type detection and display).
  string filename = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];

  // MIME type of the file being uploaded (e.g., "video/mp4").
  string content_type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 64}
  ];

  // File size in bytes (max 5GB).
  int64 size_bytes = 3 [
    (buf.validate.field).int64 = {gt: 0, lte: 5368709120}
  ];

  // Optional title for the video.
  optional string title = 4 [
    (buf.validate.field).string = {max_len: 255}
  ];

  // Optional description.
  optional string description = 5 [
    (buf.validate.field).string = {max_len: 2000}
  ];

  // Optional tags for categorization (max 20).
  repeated string tags = 6 [
    (buf.validate.field).repeated = {max_items: 20}
  ];

  // Visibility setting: "public", "unlisted" or "private".
  //
  // When omitted (or sent as an empty string), the app's hosting
  // default_visibility applies; if the app has no default_visibility set
  // either, the video is created "unlisted".
  optional string visibility = 7;

  // Optional preset reference for the auto-transcode job.
  // Accepts either a preset ID (e.g., "pst_abc123") or slug (e.g., "gaming_1080p_60_standard").
  // When provided, the preset's settings drive the encoding instead of the
  // app's default auto-profile ABR ladder.
  // The preset must exist and be accessible to the app at CompleteUpload time.
  optional string preset = 9 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];

  // When true, attach an animated hover-preview (mode=animated, worker smart
  // defaults: ~4 s, 12 fps, 320 px) to the managed transcode, in addition to the
  // poster. Free — animated previews add no cost. The produced WebP/MP4 loop
  // surface as Video.hover_preview_url / hover_preview_mp4_url once ready.
  bool hover_previews = 10;

  // When true, generate AI captions inline with the transcode: the managed
  // job's output carries a "generate" subtitle track (language auto-detected,
  // WebVTT), produced by the same job — and on the same worker — as the
  // encode, and listed in the video's streaming manifest so players discover
  // it natively. Billed as the per-source-minute captions fee on that job;
  // the fee is only charged when a caption track is actually delivered. The
  // track surfaces as Video.text_tracks once ready. Unset or false = no
  // captions.
  optional bool auto_captions = 11;

  // When true, also run AI insights over the inline captions: title
  // suggestions, a summary, key points, chapters, questions the content
  // answers, key terms, quotable highlights and topics (the generate track
  // carries insights.enabled = true; see SubtitleTrack.insights). Requires
  // auto_captions = true; rejected otherwise with `invalid_argument`, error
  // code `parameter_incompatible` on auto_insights. Billed as the
  // `insights_job` (EUR 0.02 per video) and `insights` (EUR 0.005 per source
  // minute) fees on the transcode job, on top of the captions fee; not
  // charged when the insights fail. The insights surface as Video.insights.
  // Deployments without the feature reject it with `invalid_argument`, error
  // code `parameter_unsupported`. Unset or false = no insights.
  optional bool auto_insights = 12;

  // Highlight clips to cut automatically once this video's AI insights are
  // ready: short MP4s around the quotes insights pick, surfaced as
  // Video.highlights (see GenerateHighlights for how they are chosen and
  // billed). Requires auto_insights = true; rejected otherwise with
  // `invalid_argument`, error code `parameter_incompatible` on highlights.
  // If the cut is refused (spend limit, past due, no usable moment, ...),
  // Video.highlights gets one failed highlight carrying the refusal's code and
  // video.highlights.failed fires. Omitted, or enabled = false: no automatic
  // highlights (GenerateHighlights can still cut them later).
  optional HighlightsConfig highlights = 13;
}

// Response from creating an upload.
message CreateUploadResponse {
  // The created video (status: "uploading").
  Video video = 1;

  // Presigned URL for the client to upload the file via HTTP PUT.
  string upload_url = 2;

  // When the upload URL expires (typically 1 hour).
  google.protobuf.Timestamp upload_expires_at = 3;
}

// Request to signal that a client-side upload has completed.
message CompleteUploadRequest {
  // Video ID returned from CreateUpload.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];
}

// Response from completing an upload.
message CompleteUploadResponse {
  // The video (status transitions to "processing").
  Video video = 1;
}

// Request to create a hosted video from a remote URL (one-call ingest).
//
// Managed hosting is enabled for the app the first time a video is created —
// there is no dashboard step and no AppService.EnableHosting call to make
// first. That first request provisions the app's storage bucket, its managed
// origin and its CDN pull zone, so it can take a few seconds longer than the
// ones after it. If provisioning fails the request is rejected with error code
// `hosting_provisioning_failed` (gRPC `unavailable`) and no video is created;
// the request is safe to retry unchanged.
message CreateFromUrlRequest {
  // App to create the video under. API-key callers may omit it (their key's app
  // is used) or pass their own app; a different app is rejected with
  // PermissionDenied. Portal/JWT callers pass it to create in a specific app in
  // their org; omitted selects the org's first active app.
  //
  // Managed hosting does not have to be enabled on it first — see the note on
  // this message; the call enables it.
  string app_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];

  // Publicly-reachable source URL to ingest. Must be http:// or https:// —
  // storage-origin schemes (gs://, s3://) are not accepted here; use an origin
  // and JobService.Create for those. The URL is fetched by the worker at
  // transcode time (the API never fetches it); private/internal addresses are
  // rejected up front and again, authoritatively, at fetch time (SSRF defense).
  string url = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 2048,
    (buf.validate.field).string.pattern = "^https?://.*$"
  ];

  // Optional title for the video.
  optional string title = 3 [
    (buf.validate.field).string = {max_len: 255}
  ];

  // Optional description.
  optional string description = 4 [
    (buf.validate.field).string = {max_len: 2000}
  ];

  // Optional tags for categorization (max 20).
  repeated string tags = 5 [
    (buf.validate.field).repeated = {max_items: 20}
  ];

  // Visibility setting: "public", "unlisted" or "private".
  //
  // When omitted (or sent as an empty string), the app's hosting
  // default_visibility applies; if the app has no default_visibility set
  // either, the video is created "unlisted".
  optional string visibility = 6;

  // Optional preset reference for the auto-transcode job.
  // Accepts either a preset ID (e.g., "pst_abc123") or slug (e.g., "gaming_1080p_60_standard").
  // When provided, the preset's settings drive the encoding instead of the
  // app's default auto-profile ABR ladder.
  optional string preset = 7 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];

  // When true, attach an animated hover-preview (mode=animated, worker smart
  // defaults) to the managed transcode, in addition to the poster. Free. The
  // produced loop surfaces as Video.hover_preview_url / hover_preview_mp4_url.
  bool hover_previews = 8;

  // When true, generate AI captions inline with the transcode: the managed
  // job's output carries a "generate" subtitle track (language auto-detected,
  // WebVTT), produced by the same job — and on the same worker — as the
  // encode, and listed in the video's streaming manifest so players discover
  // it natively. Billed as the per-source-minute captions fee on that job;
  // the fee is only charged when a caption track is actually delivered. The
  // track surfaces as Video.text_tracks once ready. Unset or false = no
  // captions.
  optional bool auto_captions = 9;

  // When true, also run AI insights over the inline captions: title
  // suggestions, a summary, key points, chapters, questions the content
  // answers, key terms, quotable highlights and topics (the generate track
  // carries insights.enabled = true; see SubtitleTrack.insights). Requires
  // auto_captions = true; rejected otherwise with `invalid_argument`, error
  // code `parameter_incompatible` on auto_insights. Billed as the
  // `insights_job` (EUR 0.02 per video) and `insights` (EUR 0.005 per source
  // minute) fees on the transcode job, on top of the captions fee; not
  // charged when the insights fail. The insights surface as Video.insights.
  // Deployments without the feature reject it with `invalid_argument`, error
  // code `parameter_unsupported`. Unset or false = no insights.
  optional bool auto_insights = 10;

  // Highlight clips to cut automatically once this video's AI insights are
  // ready: short MP4s around the quotes insights pick, surfaced as
  // Video.highlights (see GenerateHighlights for how they are chosen and
  // billed). Requires auto_insights = true; rejected otherwise with
  // `invalid_argument`, error code `parameter_incompatible` on highlights.
  // If the cut is refused (spend limit, past due, no usable moment, ...),
  // Video.highlights gets one failed highlight carrying the refusal's code and
  // video.highlights.failed fires. Omitted, or enabled = false: no automatic
  // highlights (GenerateHighlights can still cut them later).
  optional HighlightsConfig highlights = 11;
}

// Response from creating a video from a URL.
message CreateFromUrlResponse {
  // The created video (status: "processing"). No video.uploaded event fires for
  // URL ingest (no bytes are uploaded); the job lifecycle plus video.ready /
  // video.failed cover the outcome.
  Video video = 1;
}

// =============================================================================
// Multipart Upload RPCs
// =============================================================================

// A single part in a multipart upload with its presigned URL.
message UploadPart {
  // Part number (1-based).
  int32 part_number = 1;

  // Presigned PUT URL for uploading this part.
  string upload_url = 2;
}

// A completed part with its ETag from S3.
message CompletedPart {
  // Part number (1-based, must match what was uploaded).
  int32 part_number = 1 [
    (buf.validate.field).int32 = {gte: 1, lte: 10000}
  ];

  // ETag returned by S3 after uploading the part.
  string etag = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 256}
  ];
}

// Request to create a multipart upload for large files.
//
// Managed hosting is enabled for the app the first time a video is created —
// there is no dashboard step and no AppService.EnableHosting call to make
// first. That first request provisions the app's storage bucket, its managed
// origin and its CDN pull zone, so it can take a few seconds longer than the
// ones after it. If provisioning fails the request is rejected with error code
// `hosting_provisioning_failed` (gRPC `unavailable`) and no video is created;
// the request is safe to retry unchanged.
message CreateMultipartUploadRequest {
  // App to create the video under. API-key callers may omit it (their key's app
  // is used) or pass their own app; a different app is rejected with
  // PermissionDenied. Portal/JWT callers pass it to create in a specific app in
  // their org; omitted selects the org's first active app.
  //
  // Managed hosting does not have to be enabled on it first — see the note on
  // this message; the call enables it.
  string app_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];

  // Original filename (used for content-type detection and display).
  string filename = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];

  // MIME type of the file being uploaded (e.g., "video/mp4").
  string content_type = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 64}
  ];

  // File size in bytes (max 5GB).
  int64 size_bytes = 4 [
    (buf.validate.field).int64 = {gt: 0, lte: 5368709120}
  ];

  // Number of parts the file will be split into. Client calculates
  // as ceil(size_bytes / part_size_bytes).
  int32 total_parts = 5 [
    (buf.validate.field).int32 = {gte: 1, lte: 10000}
  ];

  // Size of each part in bytes. Defaults to 25MB if not specified.
  // Minimum 5MB (except the last part which can be smaller).
  optional int64 part_size_bytes = 6;

  // Optional title for the video.
  optional string title = 10 [
    (buf.validate.field).string = {max_len: 255}
  ];

  // Optional description.
  optional string description = 11 [
    (buf.validate.field).string = {max_len: 2000}
  ];

  // Optional tags for categorization (max 20).
  repeated string tags = 12 [
    (buf.validate.field).repeated = {max_items: 20}
  ];

  // Visibility setting: "public", "unlisted" or "private".
  //
  // When omitted (or sent as an empty string), the app's hosting
  // default_visibility applies; if the app has no default_visibility set
  // either, the video is created "unlisted".
  optional string visibility = 13;

  // Optional preset reference for the auto-transcode job.
  optional string preset = 14 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];

  // When true, attach an animated hover-preview (mode=animated, worker smart
  // defaults) to the managed transcode, in addition to the poster. Free. The
  // produced loop surfaces as Video.hover_preview_url / hover_preview_mp4_url.
  bool hover_previews = 15;

  // When true, generate AI captions inline with the transcode: the managed
  // job's output carries a "generate" subtitle track (language auto-detected,
  // WebVTT), produced by the same job — and on the same worker — as the
  // encode, and listed in the video's streaming manifest so players discover
  // it natively. Billed as the per-source-minute captions fee on that job;
  // the fee is only charged when a caption track is actually delivered. The
  // track surfaces as Video.text_tracks once ready. Unset or false = no
  // captions.
  optional bool auto_captions = 16;

  // When true, also run AI insights over the inline captions: title
  // suggestions, a summary, key points, chapters, questions the content
  // answers, key terms, quotable highlights and topics (the generate track
  // carries insights.enabled = true; see SubtitleTrack.insights). Requires
  // auto_captions = true; rejected otherwise with `invalid_argument`, error
  // code `parameter_incompatible` on auto_insights. Billed as the
  // `insights_job` (EUR 0.02 per video) and `insights` (EUR 0.005 per source
  // minute) fees on the transcode job, on top of the captions fee; not
  // charged when the insights fail. The insights surface as Video.insights.
  // Deployments without the feature reject it with `invalid_argument`, error
  // code `parameter_unsupported`. Unset or false = no insights.
  optional bool auto_insights = 17;

  // Highlight clips to cut automatically once this video's AI insights are
  // ready: short MP4s around the quotes insights pick, surfaced as
  // Video.highlights (see GenerateHighlights for how they are chosen and
  // billed). Requires auto_insights = true; rejected otherwise with
  // `invalid_argument`, error code `parameter_incompatible` on highlights.
  // If the cut is refused (spend limit, past due, no usable moment, ...),
  // Video.highlights gets one failed highlight carrying the refusal's code and
  // video.highlights.failed fires. Omitted, or enabled = false: no automatic
  // highlights (GenerateHighlights can still cut them later).
  optional HighlightsConfig highlights = 18;
}

// Response from creating a multipart upload.
message CreateMultipartUploadResponse {
  // The created video (status: "uploading").
  Video video = 1;

  // S3 multipart upload ID. Required for all subsequent part operations.
  string upload_id = 2;

  // Presigned URLs for the first batch of parts (up to 50).
  // Use GetUploadPartUrls to fetch URLs for remaining parts.
  repeated UploadPart parts = 3;

  // When the presigned URLs expire (typically 1 hour).
  google.protobuf.Timestamp urls_expire_at = 4;
}

// Request to get fresh presigned URLs for specific parts.
message GetUploadPartUrlsRequest {
  // Video ID returned from CreateMultipartUpload.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // S3 multipart upload ID from CreateMultipartUpload.
  string upload_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 256}
  ];

  // Part numbers to generate URLs for (1-based, max 100 per request).
  repeated int32 part_numbers = 3 [
    (buf.validate.field).repeated = {min_items: 1, max_items: 100}
  ];
}

// Response with presigned URLs for requested parts.
message GetUploadPartUrlsResponse {
  // Presigned URLs for the requested parts.
  repeated UploadPart parts = 1;

  // When the presigned URLs expire.
  google.protobuf.Timestamp urls_expire_at = 2;
}

// Request to complete a multipart upload with ETags from all parts.
message CompleteMultipartUploadRequest {
  // Video ID returned from CreateMultipartUpload.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // S3 multipart upload ID from CreateMultipartUpload.
  string upload_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 256}
  ];

  // Completed parts with their ETags (must include all parts).
  repeated CompletedPart parts = 3 [
    (buf.validate.field).repeated = {min_items: 1}
  ];
}

// Response from completing a multipart upload.
message CompleteMultipartUploadResponse {
  // The video (status transitions to "processing").
  Video video = 1;
}

// Request to abort a multipart upload.
message AbortMultipartUploadRequest {
  // Video ID returned from CreateMultipartUpload.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // S3 multipart upload ID from CreateMultipartUpload.
  string upload_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 256}
  ];
}

// Response from aborting a multipart upload.
message AbortMultipartUploadResponse {}

// =============================================================================
// CRUD RPCs
// =============================================================================

// Request to get a video by ID.
message GetVideoRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];
}

// Response from getting a video.
message GetVideoResponse {
  // The requested video.
  Video video = 1;
}

// Request to list videos.
message ListVideosRequest {
  // Maximum number of videos to return (1-100).
  int32 page_size = 1 [
    (buf.validate.field).int32 = {gte: 1, lte: 100}
  ];

  // Pagination token from a previous ListVideosResponse.
  optional string page_token = 2;

  // Optional filter by status (e.g., "ready", "processing").
  optional string status = 3;

  // Optional app filter. API-key callers may omit it (their key's app is used)
  // or pass their own app; a different app is rejected with PermissionDenied.
  // Portal/JWT callers pass it to list a specific app in their org; omitted
  // returns videos across all apps in the org.
  optional string app_id = 4 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];
}

// Response from listing videos.
message ListVideosResponse {
  // List of videos.
  repeated Video videos = 1;

  // Token for fetching the next page. Absent if no more pages.
  optional string next_page_token = 2;

  // Total number of matching videos.
  int32 total_count = 3;
}

// Request to update a video's mutable fields.
message UpdateVideoRequest {
  // clear_tags and a non-empty tags list are mutually exclusive: clearing and
  // replacing tags in the same request is contradictory.
  option (buf.validate.message).cel = {
    id: "update_video.clear_tags_excludes_tags"
    message: "clear_tags cannot be combined with a non-empty tags list"
    expression: "!has(this.clear_tags) || !this.clear_tags || size(this.tags) == 0"
  };

  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // Updated title.
  optional string title = 2;

  // Updated description.
  optional string description = 3;

  // Updated tags (replaces existing tags). Because proto3 repeated fields carry
  // no presence, an empty list is indistinguishable from "unset" on the wire
  // and leaves existing tags unchanged. To remove all tags, set clear_tags.
  repeated string tags = 4;

  // Updated visibility.
  optional string visibility = 5;

  // Set to true to remove all tags. Mutually exclusive with tags.
  optional bool clear_tags = 6;

  // Pin or unpin this video's source file against the app's
  // delete_source_after_days lifecycle rule. Pinning also immediately clears any
  // pending deletion schedule. Unpinning does NOT reschedule — the sweeper
  // re-evaluates later with a fresh warning webhook.
  optional bool source_pinned = 7;
}

// Response from updating a video.
message UpdateVideoResponse {
  // The updated video.
  Video video = 1;
}

// Request to delete a video.
message DeleteVideoRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];
}

// Response from deleting a video.
message DeleteVideoResponse {}

// =============================================================================
// Watch RPC
// =============================================================================

// Request to watch a video for real-time status updates.
message WatchVideoRequest {
  // Video ID to watch.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];
}

// Streamed response with video state and event type.
message WatchVideoResponse {
  // Current video state.
  Video video = 1;

  // Type of event that triggered this update. One of: "snapshot" (initial
  // state on subscribe), "status_change", "progress", "completed".
  string event_type = 2;
}

// =============================================================================
// Usage RPC
// =============================================================================

// Request to get usage summary for a billing period.
message GetUsageRequest {
  // Billing month in YYYY-MM format (e.g., "2026-04").
  // Defaults to the current month if not specified.
  optional string billing_month = 1;
}

// Response with usage summary.
message GetUsageResponse {
  // Usage breakdown for the requested period.
  UsageSummary usage = 1;
}

// Aggregated usage and cost summary for a billing period.
message UsageSummary {
  // Billing month in YYYY-MM format.
  string billing_month = 1;

  // Encoding metrics.
  int32 videos_encoded = 2;
  double encoding_minutes = 3;
  double encoding_cost = 4;

  // Storage metrics.
  double storage_gb_avg = 10;
  // Storage cost of the period so far, as your invoice will carry it. Each
  // day is one GB-day: the day's stored bytes at the day's monthly price
  // divided by the days in that month. Days already billed are reported at
  // the rate they were billed at, so a later price or rate-card change never
  // re-prices them; the remaining days (see hosting_estimated_from) are
  // estimated the same way at your current rate.
  double storage_cost = 11;
  int32 videos_hosted = 12;

  // Egress metrics.
  double egress_gb = 20;
  // Delivery cost of the period so far, as your invoice will carry it:
  // billed delivery at the rate it was billed at, delivery not billed yet
  // estimated at your current rate.
  double egress_cost = 21;
  int64 total_requests = 22;

  // Total cost across all categories.
  double total_cost = 30;

  // ISO 4217 currency code for all monetary fields in this summary (e.g. "EUR").
  string currency = 31;

  // First day (YYYY-MM-DD, UTC) whose storage or delivery cost is an
  // estimate rather than billed usage. Hosting is billed daily, through the
  // previous day, so while you store or deliver video the current period has
  // an estimated tail, and the estimate turns into the billed amount as each
  // day is billed. Empty when no day with hosting usage in the period is
  // still unbilled, which is when storage_cost and egress_cost match your
  // invoice (to within the sub-cent remainder carried to the next charge).
  string hosting_estimated_from = 32;

  // Per-day usage breakdown for the billing period identified by
  // billing_month, oldest day first. With a billing anchor day other than 1,
  // the period spans into the following calendar month, so dates are not
  // limited to the named month. Only days with recorded activity are present
  // (no zero-fill): a day is omitted when it had no storage snapshot, no
  // egress, and no video encoded. Powers the dashboard's usage-trend charts.
  // Populated for both app-scoped and org-scoped (aggregated across the
  // org's apps) calls.
  repeated DailyUsage daily = 40;
}

// One calendar day's slice of usage within a billing period (see
// UsageSummary.daily for period semantics). All monetary fields are in the
// parent UsageSummary's `currency`.
message DailyUsage {
  // Calendar day in YYYY-MM-DD format (UTC).
  string date = 1;

  // Total stored bytes as of this day's snapshot. Point-in-time (the day's
  // recorded storage level), not an increment over the prior day. Zero when
  // no snapshot was taken that day.
  int64 storage_bytes = 2;

  // Bytes egressed during this day (sum of the day's hourly egress records).
  int64 egress_bytes = 3;

  // CDN requests served during this day (sum of the day's hourly records).
  int64 request_count = 4;

  // Encoding cost for videos created on this day, derived from the linked
  // transcoding jobs' actual cost. Zero when no billable video was created.
  double encoding_cost = 5;
}

// =============================================================================
// Playback analytics RPCs
// =============================================================================

// Request for a single video's playback stats.
message GetStatsRequest {
  // Video ID to fetch stats for.
  string video_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // Optional inclusive start of the UTC date range, YYYY-MM-DD (e.g.
  // "2026-07-01"). Omitted means unbounded (all retained history).
  optional string start_date = 2;

  // Optional inclusive end of the UTC date range, YYYY-MM-DD. Omitted means
  // unbounded (up to today).
  optional string end_date = 3;
}

// Response with a video's daily playback stats and range totals.
message GetStatsResponse {
  // Per-day rows within the requested range, oldest day first. Only days with
  // recorded activity are present (no zero-fill).
  repeated VideoStatsDay daily = 1;

  // Totals across the returned days.
  VideoStatsTotals totals = 2;
}

// One UTC day of playback stats for a video.
message VideoStatsDay {
  // Calendar day in YYYY-MM-DD format (UTC).
  string date = 1;

  // Number of playback starts (one 'play' beacon per pageview that began
  // playing).
  int32 plays = 2;

  // Approximate watch time in seconds. Derived from playback heartbeats
  // (heartbeat count × the ~10s heartbeat interval), not exact wall-clock
  // time — a partial final interval still counts as a whole one.
  int64 watch_seconds = 3;

  // Distinct viewers, counted by an anonymous per-pageview session id (no PII).
  int32 unique_viewers = 4;
}

// Aggregated playback totals over a date range.
message VideoStatsTotals {
  // Sum of daily plays.
  int32 plays = 1;

  // Sum of daily approximate watch seconds.
  int64 watch_seconds = 2;

  // Sum of per-day unique viewers. A viewer active on N distinct days counts N
  // times (it is not de-duplicated across days); for a single-day range it is
  // exact.
  int32 unique_viewers = 3;
}

// Request for an app's top videos by plays.
message ListTopVideosRequest {
  // Optional app filter. API-key callers may omit it (their key's app is used)
  // or pass their own app; a different app is rejected with PermissionDenied.
  // Portal/JWT callers pass the app to scope the leaderboard; omitted resolves
  // to the org's first app.
  optional string app_id = 1 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];

  // Optional inclusive UTC date range bounds, YYYY-MM-DD. Omitted means
  // unbounded on that side.
  optional string start_date = 2;
  optional string end_date = 3;

  // Maximum number of videos to return (1-100). Defaults to 10.
  optional int32 limit = 4 [
    (buf.validate.field).int32 = {gte: 1, lte: 100}
  ];
}

// Response with an app's ranked videos.
message ListTopVideosResponse {
  // Videos ordered by plays (then watch time) descending.
  repeated TopVideo items = 1;
}

// A single ranked video with its playback totals over the requested range.
message TopVideo {
  // Video ID.
  string video_id = 1;

  // Video title, if set.
  optional string title = 2;

  // Poster image URL, computed from the app's CDN config. Absent when no CDN
  // is configured or the video has no poster.
  optional string poster_url = 3;

  // Total plays over the range.
  int64 plays = 4;

  // Total approximate watch seconds over the range.
  int64 watch_seconds = 5;

  // Unique viewers over the range, summed per day (a viewer active on N days
  // counts N times; exact for a single-day range). See VideoStatsTotals.
  int64 unique_viewers = 6;
}

// =============================================================================
// SEO markup
// =============================================================================

// Request for ready-to-paste SEO markup for a hosted video.
message GetSeoMarkupRequest {
  // Video ID.
  string video_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // Absolute https:// URL of YOUR page that shows the video (the page the
  // markup will be pasted into). Used as the sitemap location and as the base
  // of every chapter deep link.
  string watch_url = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 9, max_len: 2048, prefix: "https://"}
  ];

  // Query parameter your page reads to start playback at a time, in whole
  // seconds. Default: "t", giving chapter links like
  // "https://example.com/watch/42?t=95".
  optional string deep_link_param = 3 [
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^[A-Za-z0-9_-]+$"}
  ];

  // ISO 639-2 language of the transcript and insights to use, when the video
  // has more than one. Default: the video's first generated transcript.
  optional string language = 4 [
    (buf.validate.field).string.pattern = "^[a-z]{3}$"
  ];
}

// Ready-to-paste SEO markup for a hosted video. Every string is complete and
// escaped for its context; paste it as-is.
message GetSeoMarkupResponse {
  // schema.org VideoObject as JSON-LD, ready to place inside
  // `<script type="application/ld+json">`. Includes name, description,
  // thumbnailUrl, uploadDate, duration (ISO 8601), embedUrl and, when the
  // video has ready insights, hasPart Clip key moments from its chapters,
  // each linking to watch_url at the chapter start. thumbnailUrl and embedUrl
  // are stable player URLs that never expire (the thumbnail redirects to the
  // current poster), so the markup can be stored as-is.
  string json_ld = 1;

  // A `<url>` entry for a video sitemap (namespace
  // xmlns:video="http://www.google.com/schemas/sitemap-video/1.1"), to add
  // to your sitemap's `<urlset>`.
  string sitemap_entry = 2;

  // Server-renderable semantic HTML (no scripts, no styles): a
  // `<section class="tx-insights">` with the summary, key points and chapter
  // links (when insights are ready) and the full transcript inside
  // `<details><summary>Transcript</summary>…</details>`. Empty sections are
  // omitted.
  string html_fragment = 3;
}

// =============================================================================
// Insights from existing captions
// =============================================================================

// Request to generate AI insights from a hosted video's existing captions.
message GenerateInsightsRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // ISO 639-2 language of the AI caption track to use (e.g. "eng"). Optional
  // when the video has exactly one AI caption track; required when it has
  // several (refused with code parameter_required, listing the available
  // languages).
  optional string language = 2 [
    (buf.validate.field).string.pattern = "^[a-z]{3}$"
  ];

  // Optional free-text guidance about the content, its audience or the tone
  // you want, at most 300 characters. Same meaning as InsightsOptions.hint.
  optional string hint = 3 [(buf.validate.field).string.max_len = 300];

  // Optional app the video belongs to. API-key callers may omit it (their
  // key's app is used) or pass their own app; a different app is rejected
  // with PermissionDenied. Portal/JWT callers may pass it; omitted, the app
  // is resolved from the video.
  optional string app_id = 4 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];
}

// Response from GenerateInsights.
message GenerateInsightsResponse {
  // The insights entry: newly created, or the one already pending for this
  // video and language. Status is "pending"; poll VideoService.Get (or
  // Watch) or subscribe to video.insights.ready / video.insights.failed.
  TranscriptInsights insights = 1;
}

// =============================================================================
// Highlight clips
// =============================================================================

// How highlight clips are chosen from a video's AI insights.
//
// Each quote insights picked (TranscriptInsights.highlights) becomes one
// window: padded by padding_seconds on both sides and kept inside the video;
// a window shorter than min_seconds is extended forward (or, at the end of
// the video, backward) to min_seconds, and one longer than max_seconds is cut
// at max_seconds from its start. Overlapping windows are merged. If more than
// max_count remain, the longest are kept (ties go to the earlier one).
message HighlightsConfig {
  // Create-time option only: true cuts the highlights automatically once the
  // video's AI insights are ready. Ignored by GenerateHighlights, which always
  // cuts them.
  bool enabled = 1;

  // Maximum number of highlights, 1 to 10. Default 5.
  optional int32 max_count = 2 [(buf.validate.field).int32 = {gte: 1, lte: 10}];

  // Shortest highlight in seconds, 1 to 300. Default 8. A video shorter than
  // this yields one highlight of the whole video.
  optional double min_seconds = 3 [(buf.validate.field).double = {gte: 1, lte: 300}];

  // Longest highlight in seconds, 1 to 300, and not below min_seconds.
  // Default 60.
  optional double max_seconds = 4 [(buf.validate.field).double = {gte: 1, lte: 300}];

  // Seconds added before and after each quote so words are not cut off, 0 to
  // 10. Default 1.5.
  optional double padding_seconds = 5 [(buf.validate.field).double = {gte: 0, lte: 10}];
}

// Processing state of a highlight clip.
enum VideoHighlightStatus {
  VIDEO_HIGHLIGHT_STATUS_UNSPECIFIED = 0;

  // Its clip job is queued or rendering.
  VIDEO_HIGHLIGHT_STATUS_PENDING = 1;

  // Rendered; playback_url and poster_url are available.
  VIDEO_HIGHLIGHT_STATUS_READY = 2;

  // Could not be rendered (or was refused); error_code says why. Its clip job,
  // if any, bills what a failed or canceled job bills; highlight clips carry
  // no processing fee.
  VIDEO_HIGHLIGHT_STATUS_FAILED = 3;
}

// One highlight clip of a hosted video (read-only).
message VideoHighlight {
  // Highlight ID (hl_ prefix).
  string id = 1;

  // Where the clip starts and ends in the video, in seconds.
  double start_seconds = 2;
  double end_seconds = 3;

  // The quote the clip was cut around, shortened to at most 120 characters.
  string title = 4;

  // Processing state.
  VideoHighlightStatus status = 5;

  // Why the highlight failed: the clip job's own error code when it has one
  // (for example input_not_found); highlight_render_failed when the job
  // failed or was canceled without one; the refusal's own code (for example
  // billing_past_due or queue_limit_exceeded) when the account refused the
  // job; highlight_job_refused when the job was never created for another
  // reason. Present only when status is "failed".
  //
  // A create-time highlights request that is refused outright is recorded as
  // ONE failed highlight with the refusal's code and start_seconds =
  // end_seconds = 0 (it has no window and no job).
  optional string error_code = 6;

  // Signed (on token-auth apps) MP4 URL of the clip. Present only when status
  // is "ready" and the video's URLs can be issued (the same rules as
  // Video.poster_url).
  optional string playback_url = 7;

  // Poster frame URL, from the first frame of the clip. Same rules as
  // playback_url.
  optional string poster_url = 8;

  // Rendered length in seconds, as measured. Present once ready.
  optional double duration_seconds = 9;

  // The clip job that renders it (billed like any clip job). Present once the
  // job was created.
  optional string job_id = 10;

  // Language of the insights the quote came from (ISO 639-2).
  string language = 11;

  // When the highlight was requested.
  google.protobuf.Timestamp created_at = 12;
}

// Request to cut highlight clips from a hosted video.
message GenerateHighlightsRequest {
  // Video ID.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 32, pattern: "^vid_[a-zA-Z0-9_-]+$"}
  ];

  // ISO 639-2 language of the AI insights to cut from (e.g. "eng"). Optional
  // when the video has ready insights in exactly one language; required when
  // it has several (refused with code parameter_required, listing them).
  optional string language = 2 [
    (buf.validate.field).string.pattern = "^[a-z]{3}$"
  ];

  // How to choose the clips. Omitted fields take their defaults; enabled is
  // ignored here.
  optional HighlightsConfig config = 3;

  // Optional app the video belongs to. API-key callers may omit it (their
  // key's app is used) or pass their own app; a different app is rejected
  // with PermissionDenied. Portal/JWT callers may pass it; omitted, the app
  // is resolved from the video.
  optional string app_id = 4 [
    (buf.validate.field).string.pattern = "^app_[a-zA-Z0-9_-]+$"
  ];
}

// Response from GenerateHighlights.
message GenerateHighlightsResponse {
  // The video's highlights: the new set, each "pending" (or "failed" when an
  // account limit refused its job), or the set already pending. Poll
  // VideoService.Get (or Watch) or subscribe to video.highlights.ready /
  // video.highlights.failed.
  repeated VideoHighlight highlights = 1;
}
