// Content-aware encoding configuration.
syntax = "proto3";

package transcodely.v1;

import "buf/validate/validate.proto";
import "transcodely/v1/common.proto";

// Content-aware encoding mode.
//
// One of the two modes ships: `per_title` is accepted and acted on. `auto_abr`
// is still rejected at CreateJob with error code `parameter_unsupported` and
// the message "auto_abr is not available yet; per_title is" (issue #167),
// because it would change the NUMBER of renditions after the job was already
// quoted per rendition at create time.
enum ContentAwareMode {
  CONTENT_AWARE_MODE_UNSPECIFIED = 0;

  // Find the CRF this source needs to reach the VMAF target, and encode the
  // declared ladder at it. The search runs once per output, on the ladder's
  // highest-resolution quality-driven rendition; the lower rungs move by the
  // CRF offsets the ladder already declares. Priced at 1.5x. What the search
  // decided comes back on OutputReport.content_aware.
  CONTENT_AWARE_MODE_PER_TITLE = 1;

  // Generate the bitrate ladder automatically. NOT YET ACCEPTED — rejected at
  // create.
  CONTENT_AWARE_MODE_AUTO_ABR = 2;
}

// Auto ABR ladder generation constraints.
//
// NOT YET ACCEPTED — see ContentAwareConfig. These constraints are validated
// for shape but never applied, because a request in auto_abr mode is rejected
// at create.
message AutoABRConfig {
  // Minimum number of variants in the ladder.
  // Default: 2.
  optional int32 min_variants = 1 [
    (buf.validate.field).int32.gte = 2,
    (buf.validate.field).int32.lte = 20
  ];

  // Maximum number of variants in the ladder.
  // Default: 8.
  optional int32 max_variants = 2 [
    (buf.validate.field).int32.gte = 2,
    (buf.validate.field).int32.lte = 20
  ];

  // Lowest resolution in the generated ladder.
  Resolution min_resolution = 3 [
    (buf.validate.field).enum.defined_only = true
  ];

  // Highest resolution in the generated ladder.
  Resolution max_resolution = 4 [
    (buf.validate.field).enum.defined_only = true
  ];
}

// Content-aware encoding configuration for an output.
//
// In `per_title` mode the encode is tuned to this particular source: the worker
// measures short samples of it at several CRFs and encodes the declared ladder
// at the cheapest one that reaches the VMAF target. The ladder itself is
// unchanged — same renditions, same resolutions — so the price quoted at create
// still holds, with the 1.5x per-title multiplier applied.
//
// Three requests are refused at create:
//   - `auto_abr` mode (`parameter_unsupported`) — not available yet;
//   - an output with no video renditions, or one whose every video rendition is
//     pinned to an explicit bitrate (`parameter_incompatible`) — a pinned
//     rendition ignores CRF, so the search would change nothing while still
//     being billed;
//   - a source shorter than 120 seconds, refused at probe with
//     `per_title_source_too_short` once the input has been measured.
//
// What the search decided is reported back on OutputReport.content_aware.
message ContentAwareConfig {
  // Encoding mode (required). `per_title` is accepted; `auto_abr` is rejected
  // at create.
  ContentAwareMode mode = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // Override VMAF target (80-97). Default: 93, regardless of quality tier.
  //
  // The range is the one the per-title search can actually work in, narrowed
  // from 70-99 before the feature was ever accepted: below 80 the result is not
  // a quality target anyone would ask for, and above 97 the search cannot
  // distinguish the last point from the one below it. Asking for a number we
  // would silently move is worse than refusing it.
  //
  // The value the analysis actually searched against is reported back on
  // OutputReport.content_aware.vmaf_target, which is the one to read.
  optional double vmaf_target = 2 [
    (buf.validate.field).double.gte = 80,
    (buf.validate.field).double.lte = 97
  ];

  // Auto ABR constraints (only for auto_abr mode). NOT YET ACCEPTED — an
  // auto_abr request is rejected at create whatever these say.
  optional AutoABRConfig auto_abr = 3;
}

// Content analysis results from extended probe.
//
// NOT YET POPULATED, and not carried by any RPC. The worker measures these
// complexity scores but has nowhere to send them: the API stores the per-title
// SEARCH RESULT (see OutputReportContentAware) and not the source scores behind
// it. Retained for wire compatibility.
message ContentAnalysis {
  // Overall encoding complexity (0-1).
  double complexity_score = 1;

  // Temporal complexity - amount of motion (0-1).
  double motion_score = 2;

  // Spatial detail complexity (0-1).
  double texture_score = 3;

  // Detected content type.
  string content_type = 4;
}
